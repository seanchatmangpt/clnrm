[package]
name = "ggen-integration-example"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
uuid = { version = "1.0", features = ["v4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "ggen_example"
path = "src/main.rs"

[lib]
name = "ggen_integration_example"
path = "src/lib.rs"
