[workspace]
resolver = "2"

members = [
  "crates/clnrm-cli",
  "crates/clnrm-core",
  "crates/clnrm-lsp",
]

# Default members for core functionality (template excluded - experimental)
default-members = [
  "crates/clnrm-cli",
  "crates/clnrm-core",
  "crates/clnrm-lsp",
]

[workspace.package]
version = "26.5.28"
edition = "2021"
license = "MIT"
authors = ["Sean Chatman <seanchatmangpt@gmail.com>"]
repository = "https://github.com/seanchatmangpt/clnrm"

[workspace.dependencies]
# LSP dependencies
lsp-max = "26.6.9"

# Core dependencies
tokio = { version = "1.0", features = ["full"] }
tokio-util = { version = "0.7" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tracing = "0.1"

# Container dependencies
# NOTE: testcontainers is legacy and only available via backend-testcontainers feature
# Default backend is gVisor (no Docker required) - see crates/clnrm-core/Cargo.toml features
testcontainers = { version = "0.27", features = ["blocking"] }
testcontainers-modules = { version = "0.13", features = ["surrealdb"] }
futures-util = "0.3"
surrealdb = "3.1"

# CLI dependencies
clap = { version = "4.5.49", features = ["derive"] }
env_logger = "0.11.8"
log = "0.4.28"
toml = "1.1.0"
regex = "1.0"
walkdir = "2.5"
tempfile = "3.0"
junit-report = "0.8"
notify = "8.0"
toml_edit = "0.25"
quick-xml = { version = "0.40", features = ["serialize"] }

# OpenTelemetry dependencies
opentelemetry = { version = "0.32.0", default-features = false, features = [
  "trace",
  "metrics",
  "logs",
  "futures",
] }
opentelemetry_sdk = { version = "0.32.0", default-features = false, features = [
  "trace",
  "metrics",
  "logs",
  "rt-tokio",
  "testing",
  "spec_unstable_metrics_views",
] }
opentelemetry-stdout = { version = "0.32.0", features = [
  "trace",
  "metrics",
  "logs",
] }
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = [
  "trace",
  "metrics",
  "logs",
  "http-proto",
  "grpc-tonic",
  "reqwest-client",
] }
opentelemetry-zipkin = { version = "0.32.0" }
opentelemetry-semantic-conventions = { version = "0.32.0", features = ["semconv_experimental"] }
tracing-opentelemetry = "0.33.0"
tracing-subscriber = { version = "0.3.20", features = [
  "fmt",
  "env-filter",
  "registry",
] }

# Additional dependencies for OTLP integration
reqwest = { version = "0.13", features = ["json", "rustls", "blocking"] }

# Utility dependencies
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
hostname = "0.4"
once_cell = "1.19"
dashmap = "6.1"

# Snapshot testing dependencies
insta = { version = "1.34", features = ["json", "yaml"] }

# Benchmarking dependencies
criterion = { version = "0.5.1", features = ["html_reports", "async_tokio"] }
futures = "0.3"

# Mocking dependencies for Chicago TDD
mockall = "0.14"

# Test configuration - enforce 1 second timeout per test
[profile.test]
opt-level = 1 # Slightly optimize tests for speed
debug = false # Disable debug info for faster compilation
