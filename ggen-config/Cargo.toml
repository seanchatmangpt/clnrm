[package]
name = "ggen-config"
version = "0.1.0"
edition = "2021"

[lib]
name = "ggen_config"
path = "src/lib.rs"

[[bin]]
name = "ggen-config"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
tempfile = "3"
