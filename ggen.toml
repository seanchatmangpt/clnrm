[project]
name = "clnrm"
version = "2.0.0"
description = "Cleanroom Testing Framework - ontology-driven code generation setup"
authors = ["Sean Chatman <seanchatmangpt@gmail.com>"]
license = "MIT"

[generation]
ontology_dir = "schema/"
templates_dir = "templates/"
output_dir = "generated/"
incremental = true
overwrite = false

[rdf]
formats = ["turtle"]
default_format = "turtle"
base_uri = "https://clnrm.io/ontology/"
strict_validation = false

[templates]
enable_caching = true
auto_reload = true

[output]
formatting = "default"
line_length = 100
indent = 2
