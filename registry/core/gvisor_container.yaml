# Weaver Schema: gvisor Container Lifecycle
#
# This schema defines semantic conventions for gvisor container runtime telemetry.
# It extends the standard OTel container semantic conventions with gvisor-specific
# attributes for enhanced observability and isolation verification.
#
# Version: 1.0.0
# Status: Experimental
# Owner: clnrm core team

groups:
  - id: gvisor.container.lifecycle
    type: span
    brief: "gvisor container lifecycle operations"
    note: |
      These spans track the full gvisor container lifecycle from creation to deletion.
      Unlike Docker/containerd, gvisor uses explicit create/start/delete steps.
    attributes:
      - ref: container.id
      - ref: container.image.name
      - ref: container.runtime
      - ref: gvisor.sandbox.id
      - ref: gvisor.platform
      - ref: gvisor.container.state
      - ref: gvisor.syscall_filter.enabled
      - ref: gvisor.network.mode
    events:
      - sandbox.created
      - sandbox.started
      - exec.completed
      - sandbox.stopped

  - id: gvisor.isolation.verification
    type: span
    brief: "gvisor isolation verification"
    note: |
      Spans for verifying container isolation after execution.
      Critical for security compliance and hermetic testing.
    attributes:
      - ref: gvisor.sandbox.id
      - ref: gvisor.isolation.type
      - ref: gvisor.isolation.method
      - ref: gvisor.isolation.verified
    events:
      - isolation.verified

  - id: gvisor.resource.monitoring
    type: span
    brief: "gvisor resource usage monitoring"
    note: |
      Spans for collecting resource usage metrics from cgroups.
      Provides visibility into memory, CPU, and I/O consumption.
    attributes:
      - ref: gvisor.sandbox.id
      - ref: gvisor.memory.usage_bytes
      - ref: gvisor.memory.peak_bytes
      - ref: gvisor.cpu.time_ns
      - ref: gvisor.pids.current
    events:
      - resource.snapshot

# Attribute definitions
attributes:
  # Standard OTel attributes (overrides for gvisor)
  - id: container.id
    type: string
    requirement_level: required
    brief: "Container identifier (gvisor format)"
    note: |
      For gvisor, this is prefixed with "gvisor-" followed by the sandbox ID.
      Format: gvisor-{sandbox_id}
    examples:
      - "gvisor-abc123def456"
      - "gvisor-7d2c8f5e9a1b3c4d"

  - id: container.image.name
    type: string
    requirement_level: required
    brief: "Container image name"
    examples:
      - "alpine:latest"
      - "ubuntu:22.04"

  - id: container.runtime
    type: enum
    requirement_level: required
    brief: "Container runtime identifier"
    members:
      - id: docker
        value: "docker"
        brief: "Docker runtime (default)"
      - id: gvisor
        value: "gvisor"
        brief: "gvisor runtime (runsc)"

  # gvisor-specific attributes
  - id: gvisor.sandbox.id
    type: string
    requirement_level: required
    brief: "gvisor sandbox identifier"
    note: |
      The unique identifier for the gvisor sandbox (runsc container).
      This is the actual runsc container name, without the "gvisor-" prefix.
    examples:
      - "abc123def456"
      - "7d2c8f5e9a1b3c4d"

  - id: gvisor.platform
    type: enum
    requirement_level: required
    brief: "runsc execution platform"
    note: |
      The platform used by runsc for syscall interception.
      - ptrace: Most compatible, slower performance
      - kvm: Requires KVM, better performance
      - systrap: Experimental, best performance
    members:
      - id: ptrace
        value: "ptrace"
        brief: "ptrace-based syscall interception"
      - id: kvm
        value: "kvm"
        brief: "KVM-based virtualization"
      - id: systrap
        value: "systrap"
        brief: "Experimental syscall trapping"

  - id: gvisor.container.state
    type: enum
    requirement_level: required
    brief: "gvisor container state"
    note: |
      The current state of the container in the gvisor lifecycle.
      Follows OCI runtime spec states.
    members:
      - id: created
        value: "created"
        brief: "Container created but not started"
      - id: running
        value: "running"
        brief: "Container running"
      - id: paused
        value: "paused"
        brief: "Container paused"
      - id: stopped
        value: "stopped"
        brief: "Container stopped"

  - id: gvisor.syscall_filter.enabled
    type: boolean
    requirement_level: recommended
    brief: "Syscall filtering enabled"
    note: |
      Whether gvisor is filtering syscalls via seccomp.
      Should be true for production/hermetic testing.

  - id: gvisor.network.mode
    type: enum
    requirement_level: recommended
    brief: "gvisor network mode"
    members:
      - id: none
        value: "none"
        brief: "No network (hermetic)"
      - id: host
        value: "host"
        brief: "Host network stack"
      - id: sandbox
        value: "sandbox"
        brief: "gvisor netstack (isolated)"

  - id: gvisor.sandbox.pid
    type: int
    requirement_level: recommended
    brief: "Host PID of runsc sandbox process"
    examples: [12345, 67890]

  - id: gvisor.bundle.path
    type: string
    requirement_level: optional
    brief: "Path to OCI bundle directory"
    examples:
      - "/tmp/runsc-bundle-abc123"
      - "/var/run/gvisor/bundles/xyz"

  - id: gvisor.rootfs.path
    type: string
    requirement_level: optional
    brief: "Path to container rootfs"
    examples:
      - "/var/lib/docker/overlay2/xyz/merged"

  # Resource monitoring attributes
  - id: gvisor.memory.usage_bytes
    type: int
    requirement_level: recommended
    brief: "Current memory usage in bytes"
    note: "Read from memory.current cgroup file"
    examples: [52428800, 104857600]

  - id: gvisor.memory.peak_bytes
    type: int
    requirement_level: recommended
    brief: "Peak memory usage in bytes"
    note: "Read from memory.peak cgroup file"
    examples: [104857600, 209715200]

  - id: gvisor.memory.limit_bytes
    type: int
    requirement_level: optional
    brief: "Memory limit in bytes"
    note: "Read from memory.max cgroup file"

  - id: gvisor.cpu.time_ns
    type: int
    requirement_level: recommended
    brief: "Total CPU time in nanoseconds"
    note: "Read from cpu.stat cgroup file (usage_usec * 1000)"
    examples: [1000000000, 5000000000]

  - id: gvisor.pids.current
    type: int
    requirement_level: recommended
    brief: "Number of processes in sandbox"
    note: "Read from pids.current cgroup file"
    examples: [1, 5, 10]

  - id: gvisor.io.read_bytes
    type: int
    requirement_level: optional
    brief: "Total I/O bytes read"
    note: "Read from io.stat cgroup file"

  - id: gvisor.io.write_bytes
    type: int
    requirement_level: optional
    brief: "Total I/O bytes written"
    note: "Read from io.stat cgroup file"

  # Isolation verification attributes
  - id: gvisor.isolation.type
    type: enum
    requirement_level: required
    brief: "Type of isolation being verified"
    members:
      - id: network
        value: "network"
        brief: "Network isolation"
      - id: filesystem
        value: "filesystem"
        brief: "Filesystem isolation"
      - id: pid
        value: "pid"
        brief: "PID namespace isolation"
      - id: ipc
        value: "ipc"
        brief: "IPC isolation"

  - id: gvisor.isolation.method
    type: enum
    requirement_level: recommended
    brief: "Method used for isolation verification"
    members:
      - id: gvisor_netstack
        value: "gvisor_netstack"
        brief: "gvisor network stack check"
      - id: namespace_check
        value: "namespace_check"
        brief: "Linux namespace verification"
      - id: cgroup_check
        value: "cgroup_check"
        brief: "cgroup isolation check"

  - id: gvisor.isolation.verified
    type: boolean
    requirement_level: required
    brief: "Whether isolation check passed"

  # Syscall tracing attributes (debug mode)
  - id: gvisor.syscall.blocked_count
    type: int
    requirement_level: optional
    brief: "Number of syscalls blocked by seccomp"
    note: "Only available with debug logging enabled"

  - id: gvisor.syscall.blocked_name
    type: string
    requirement_level: optional
    brief: "Name of blocked syscall"
    examples: ["ptrace", "mount", "reboot"]

  - id: gvisor.syscall.total_count
    type: int
    requirement_level: optional
    brief: "Total syscall count"
    note: "Only available with strace debugging"

# Event definitions
events:
  - id: sandbox.created
    brief: "gvisor sandbox created"
    attributes:
      - id: sandbox.id
        type: string
        requirement_level: required
      - id: bundle.path
        type: string
        requirement_level: optional

  - id: sandbox.started
    brief: "gvisor sandbox started"
    attributes:
      - id: gvisor.sandbox.pid
        type: int
        requirement_level: required
      - id: gvisor.network.mode
        type: string
        requirement_level: recommended

  - id: exec.completed
    brief: "Command execution completed in sandbox"
    attributes:
      - id: exit_code
        type: int
        requirement_level: required
      - id: duration_ms
        type: double
        requirement_level: recommended

  - id: sandbox.stopped
    brief: "gvisor sandbox stopped"
    attributes:
      - id: exit_code
        type: int
        requirement_level: required

  - id: isolation.verified
    brief: "Isolation verification completed"
    attributes:
      - id: verified
        type: boolean
        requirement_level: required
      - id: isolation.type
        type: string
        requirement_level: required
      - id: isolation.method
        type: string
        requirement_level: recommended

  - id: resource.snapshot
    brief: "Resource usage snapshot collected"
    attributes:
      - id: memory_bytes
        type: int
        requirement_level: recommended
      - id: cpu_time_ns
        type: int
        requirement_level: recommended
      - id: pid_count
        type: int
        requirement_level: recommended

  - id: syscall.blocked
    brief: "Syscall blocked by gvisor seccomp"
    attributes:
      - id: syscall.name
        type: string
        requirement_level: required

# Metric definitions
metrics:
  - id: gvisor.container.lifecycle_duration_ms
    type: histogram
    brief: "Duration of gvisor container lifecycle operations"
    unit: ms
    attributes:
      - ref: gvisor.operation
      - ref: gvisor.platform
      - ref: container.runtime

  - id: gvisor.memory.usage_bytes
    type: gauge
    brief: "Current memory usage in gvisor sandbox"
    unit: bytes
    attributes:
      - ref: gvisor.sandbox.id

  - id: gvisor.cpu.time_ns
    type: counter
    brief: "Total CPU time consumed by gvisor sandbox"
    unit: ns
    attributes:
      - ref: gvisor.sandbox.id

  - id: gvisor.syscall.blocked_count
    type: counter
    brief: "Number of syscalls blocked by gvisor seccomp"
    unit: "1"
    attributes:
      - ref: gvisor.syscall.blocked_name

  - id: gvisor.io.read_bytes
    type: counter
    brief: "Total bytes read from I/O"
    unit: bytes
    attributes:
      - ref: gvisor.sandbox.id

  - id: gvisor.io.write_bytes
    type: counter
    brief: "Total bytes written to I/O"
    unit: bytes
    attributes:
      - ref: gvisor.sandbox.id

# Additional metric attribute definitions
metric_attributes:
  - id: gvisor.operation
    type: enum
    brief: "gvisor lifecycle operation"
    members:
      - id: create
        value: "create"
      - id: start
        value: "start"
      - id: exec
        value: "exec"
      - id: stop
        value: "stop"
      - id: delete
        value: "delete"
