groups:
- id: span.clnrm.cli.red_green
  type: span
  span_kind: internal
  stability: stable
  brief: Represents TDD workflow validation via 'clnrm red-green' command
  note: 'CRITICAL VALIDATION POINTS:

    - tdd.validation_passed = (tdd.expected_state == tdd.actual_state)

    - tests.passed + tests.failed MUST equal tests.total

    - operation.duration_ms > 0 proves actual test execution occurred

    - Cannot be faked - requires actual test execution and comparison


    This span proves that clnrm successfully validated TDD workflow

    by checking whether tests are in the expected state (red or green).

    '
  attributes:
  - id: cli.command
    type: string
    stability: stable
    brief: The CLI command name
    requirement_level: required
    examples:
    - red-green
  - id: cli.version
    type: string
    stability: stable
    brief: clnrm version executing the command
    requirement_level: recommended
    examples:
    - 1.2.0
    - 1.1.0
  - id: tdd.expected_state
    type:
      allow_custom_values: false
      members:
      - id: red
        value: red
        brief: Tests should fail (feature not yet implemented)
        stability: stable
      - id: green
        value: green
        brief: Tests should pass (feature implemented correctly)
        stability: stable
    stability: stable
    brief: Expected test state in TDD cycle
    requirement_level: required
    note: What the developer expects tests to do
  - id: tdd.actual_state
    type:
      allow_custom_values: false
      members:
      - id: red
        value: red
        brief: Tests failed
        stability: stable
      - id: green
        value: green
        brief: Tests passed
        stability: stable
    stability: stable
    brief: Actual test state after execution
    requirement_level: required
    note: What the tests actually did
  - id: tdd.validation_passed
    type: boolean
    stability: stable
    brief: Whether actual state matches expected state
    requirement_level: required
    note: VALIDATION - Must equal (tdd.expected_state == tdd.actual_state)
    examples:
    - true
    - false
  - id: tests.total
    type: int
    stability: stable
    brief: Total number of tests validated
    requirement_level: required
    note: VALIDATION - tests.passed + tests.failed should equal this
    examples:
    - 10
    - 25
    - 50
  - id: tests.passed
    type: int
    stability: stable
    brief: Number of tests that passed
    requirement_level: required
    examples:
    - 10
    - 20
    - 50
  - id: tests.failed
    type: int
    stability: stable
    brief: Number of tests that failed
    requirement_level: required
    examples:
    - 0
    - 5
    - 10
  - id: operation.duration_ms
    type: double
    stability: stable
    brief: Duration of validation in milliseconds
    requirement_level: required
    note: Must be > 0, proving actual test execution occurred
    examples:
    - 5230.5
    - 12450.8
    - 25000.2
  - id: operation.success
    type: boolean
    stability: stable
    brief: Whether validation operation completed successfully
    requirement_level: required
    note: Can be true even if tdd.validation_passed = false
    examples:
    - true
    - false
  - id: error.type
    type: string
    stability: stable
    brief: Type of error if validation failed to execute
    requirement_level:
      conditionally_required: Only when operation.success is false
    examples:
    - TestExecutionError
    - ConfigurationError
  - id: error.message
    type: string
    stability: stable
    brief: Detailed error message if validation failed
    requirement_level:
      conditionally_required: Only when operation.success is false
    examples:
    - Failed to execute tests - container creation timeout
- id: span.clnrm.cli.repro
  type: span
  span_kind: internal
  stability: stable
  brief: Represents test reproduction from baseline via 'clnrm repro' command
  note: 'CRITICAL VALIDATION POINTS:

    - baseline.exists = true proves baseline file was found

    - baseline.digest proves baseline content integrity (SHA-256)

    - digest.verified proves comparison between current and baseline

    - tests.reproduced + tests.diverged proves actual reproduction attempt


    This span proves that clnrm successfully reproduced tests from a

    baseline recording and compared results to detect divergence.

    '
  attributes:
  - id: cli.command
    type: string
    stability: stable
    brief: The CLI command name
    requirement_level: required
    examples:
    - repro
  - id: cli.version
    type: string
    stability: stable
    brief: clnrm version executing the command
    requirement_level: recommended
    examples:
    - 1.2.0
    - 1.1.0
  - id: baseline.path
    type: string
    stability: stable
    brief: Path to the baseline file
    requirement_level: required
    examples:
    - /workspace/.clnrm/baselines/test_suite.baseline.json
    - ./baselines/integration_tests.json
  - id: baseline.exists
    type: boolean
    stability: stable
    brief: Whether baseline file exists at specified path
    requirement_level: required
    note: PROOF - Must be true for reproduction to proceed
    examples:
    - true
    - false
  - id: baseline.digest
    type: string
    stability: stable
    brief: SHA-256 digest of the baseline file
    requirement_level: required
    note: PROOF - Verifies baseline integrity
    examples:
    - 5d41402abc4b2a76b9719d911017c592
    - e99a18c428cb38d5f260853678922e03
  - id: baseline.digest_current
    type: string
    stability: stable
    brief: SHA-256 digest of current test execution
    requirement_level: recommended
    note: Enables comparison with baseline.digest
    examples:
    - 5d41402abc4b2a76b9719d911017c592
    - a1b2c3d4e5f67890abcdef1234567890
  - id: digest.verified
    type: boolean
    stability: stable
    brief: Whether current execution matches baseline digest
    requirement_level:
      conditionally_required: Only when baseline exists
    note: VALIDATION - True only if digests match (perfect reproduction)
    examples:
    - true
    - false
  - id: tests.total
    type: int
    stability: stable
    brief: Total number of tests in baseline
    requirement_level: required
    examples:
    - 10
    - 25
    - 50
  - id: tests.reproduced
    type: int
    stability: stable
    brief: Number of tests successfully reproduced (same result)
    requirement_level: required
    note: PROOF - Tests with identical telemetry
    examples:
    - 10
    - 23
    - 48
  - id: tests.diverged
    type: int
    stability: stable
    brief: Number of tests with different results
    requirement_level: required
    note: PROOF - Tests with non-matching telemetry
    examples:
    - 0
    - 2
    - 5
  - id: output.path
    type: string
    stability: stable
    brief: Path to reproduction report output
    requirement_level: recommended
    examples:
    - /workspace/.clnrm/repro-report.json
    - ./repro-results.txt
  - id: operation.duration_ms
    type: double
    stability: stable
    brief: Duration of reproduction in milliseconds
    requirement_level: required
    note: Must be > 0, proving actual reproduction occurred
    examples:
    - 5230.5
    - 12450.8
    - 25000.2
  - id: operation.success
    type: boolean
    stability: stable
    brief: Whether reproduction operation completed successfully
    requirement_level: required
    note: Can be true even if tests diverged
    examples:
    - true
    - false
  - id: error.type
    type: string
    stability: stable
    brief: Type of error if reproduction failed
    requirement_level:
      conditionally_required: Only when operation.success is false
    examples:
    - BaselineNotFound
    - TestExecutionError
    - DigestVerificationFailed
  - id: error.message
    type: string
    stability: stable
    brief: Detailed error message if reproduction failed
    requirement_level:
      conditionally_required: Only when operation.success is false
    examples:
    - Baseline file not found at /path/baseline.json
