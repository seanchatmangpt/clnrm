# Docker Compose for clnrm Weaver Validation Infrastructure
# Purpose: OTLP collector + Jaeger backend for live-check validation
# Usage: docker-compose -f docker-compose.weaver.yml up

services:
  # OpenTelemetry Collector
  # gVisor Migration: Updated for gVisor isolated namespace model
  # - Binds to 127.0.0.1 (localhost) for gVisor safety
  # - Environment variables for dynamic endpoint configuration
  # - Memory limits adjusted for gVisor overhead
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.112.0
    container_name: clnrm-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./config/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
      - otel-logs:/var/log/otel
    ports:
      # OTLP gRPC receiver (dynamic port support via env var)
      # gVisor: Binds to 127.0.0.1:4317 (localhost)
      - "${WEAVER_OTLP_GRPC_PORT:-4317}:4317"
      # OTLP HTTP receiver (dynamic port support via env var)
      # gVisor: Binds to 127.0.0.1:4318 (localhost)
      - "${WEAVER_OTLP_HTTP_PORT:-4318}:4318"
      # Health check endpoint
      # gVisor: Binds to 127.0.0.1:13133 (localhost)
      - "${WEAVER_HEALTH_PORT:-13133}:13133"
      # Metrics endpoint
      # gVisor: Binds to 127.0.0.1:8888 (localhost)
      - "${WEAVER_METRICS_PORT:-8888}:8888"
      # pprof profiling
      # gVisor: Binds to 127.0.0.1:1777 (localhost)
      - "${WEAVER_PPROF_PORT:-1777}:1777"
      # zpages traces
      # gVisor: Binds to 127.0.0.1:55679 (localhost)
      - "${WEAVER_ZPAGES_PORT:-55679}:55679"
    environment:
      # Memory limit for gVisor (reduced from 400MiB to account for isolation overhead)
      - GOMEMLIMIT=256MiB
      # gVisor-specific environment variables
      - OTEL_OTLP_GRPC_ENDPOINT=127.0.0.1:4317
      - OTEL_OTLP_HTTP_ENDPOINT=127.0.0.1:4318
      - OTEL_HEALTH_CHECK_ENDPOINT=127.0.0.1:13133
      - OTEL_JAEGER_ENDPOINT=${OTEL_JAEGER_ENDPOINT:-127.0.0.1:4317}
      - OTEL_LOG_LEVEL=${OTEL_LOG_LEVEL:-info}
    healthcheck:
      # gVisor: Health check uses localhost (127.0.0.1)
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:13133/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - weaver-network
    depends_on:
      - jaeger

  # Jaeger all-in-one (backend for trace storage and UI)
  # gVisor Migration: Updated for gVisor compatibility
  # - Health check uses localhost (127.0.0.1)
  # - Environment variables for configuration
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: clnrm-jaeger
    ports:
      # Jaeger UI
      - "${JAEGER_UI_PORT:-16686}:16686"
      # OTLP gRPC receiver
      # gVisor: Binds to 127.0.0.1:4317 (localhost)
      - "${JAEGER_OTLP_GRPC_PORT:-4317}:4317"
      # Jaeger native receiver (not used, but exposed)
      # gVisor: Binds to 127.0.0.1:14268 (localhost)
      - "${JAEGER_THRIFT_PORT:-14268}:14268"
      # Health check endpoint
      # gVisor: Binds to 127.0.0.1:14269 (localhost)
      - "${JAEGER_HEALTH_PORT:-14269}:14269"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=memory
      - MEMORY_MAX_TRACES=50000
      # gVisor-specific environment variables
      - OTEL_LOG_LEVEL=${OTEL_LOG_LEVEL:-info}
      - JAEGER_HEALTH_CHECK_ENDPOINT=127.0.0.1:14269
    healthcheck:
      # gVisor: Health check uses localhost (127.0.0.1)
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:14269/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    networks:
      - weaver-network

volumes:
  otel-logs:
    driver: local

networks:
  weaver-network:
    driver: bridge
    name: clnrm-weaver-network
