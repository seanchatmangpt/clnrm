[package]
name = "ggen-test-runner"
version = "0.1.0"
edition = "2021"

[dependencies]
uuid = { version = "1.0", features = ["v4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "ggen-test-runner"
path = "src/main.rs"

[lib]
name = "ggen_test_runner"
path = "src/lib.rs"
