# CI/CD Pipeline Example
# Optimized for continuous integration and deployment
# Balances speed and thoroughness with 80/20 mode

[meta]
name = "cicd_pipeline_test"
version = "1.0.0"
description = "CI/CD optimized validation with GitHub Actions integration"

# CI/CD optimized Weaver configuration
[weaver]
enabled = true
output_dir = "${CI_OUTPUT_DIR:-./ci_reports}"  # CI-friendly output
stream = true   # Real-time feedback in CI logs
fail_fast = true  # Stop on first violation to save CI time

[weaver.validation]
mode = "80_20"  # Fast validation for CI
fail_on_violations = true
fail_on_improvements = false  # Don't block on style in CI

[weaver.eighty_twenty]
critical_spans = [
    "test.execute",
    "container.start",
    "container.stop",
    "http.server.request",
    "db.query"
]

# CI-optimized performance settings
[weaver.performance]
startup_timeout_ms = 30000   # Allow time for CI environment
flush_timeout_ms = 10000     # Ensure telemetry collected in CI
max_samples = 50000          # Reasonable limit for CI

# OTEL configuration for CI environment
[otel]
exporter = "otlp-http"
sample_ratio = 1.0

resources = {
  "service.name" = "cicd_test",
  "service.version" = "${CI_COMMIT_SHA:-dev}",
  "deployment.environment" = "${CI_ENVIRONMENT:-ci}",
  "ci.pipeline.id" = "${CI_PIPELINE_ID:-local}",
  "ci.pipeline.url" = "${CI_PIPELINE_URL:-}"
}

headers = {
  "x-ci-run-id" = "${CI_RUN_ID:-}",
  "x-ci-run-number" = "${CI_RUN_NUMBER:-}"
}

# Service: Application (version from CI)
[service.app]
plugin = "generic_container"
image = "app:${CI_COMMIT_SHA:-latest}"
env = {
  "ENVIRONMENT" = "${CI_ENVIRONMENT:-ci}",
  "LOG_LEVEL" = "info",
  "CI" = "true"
}

# Service: Database (use fast in-memory for CI)
[service.db]
plugin = "generic_container"
image = "postgres:15-alpine"
env = {
  "POSTGRES_PASSWORD" = "cipass",
  "POSTGRES_DB" = "ci_test",
  "POSTGRES_INITDB_ARGS" = "--no-sync",  # Faster init for CI
  "PGDATA" = "/dev/shm/pgdata"  # In-memory for speed
}

# Scenario 1: Unit tests
[[scenario]]
name = "unit_tests"
service = "app"
run = "pytest tests/unit/ -v --tb=short"
timeout_seconds = 300  # 5 minute timeout for CI

[[expect.span]]
name = "test.execute"
attrs.all = {
  "test.name" = "unit_tests",
  "test.isolated" = "true",
  "ci.pipeline.id" = "*"
}

# Scenario 2: Integration tests
[[scenario]]
name = "integration_tests"
service = "app"
run = "pytest tests/integration/ -v --tb=short"
timeout_seconds = 600  # 10 minute timeout

[[expect.span]]
name = "test.execute"
attrs.all = {
  "test.name" = "integration_tests",
  "test.isolated" = "true"
}

[[expect.span]]
name = "http.server.request"
parent = "test.execute"
attrs.all = {
  "http.method" = "*",
  "http.status_code" = "200"
}

[[expect.span]]
name = "db.query"
parent = "http.server.request"
attrs.all = {
  "db.system" = "postgresql"
}

# Scenario 3: API smoke tests
[[scenario]]
name = "api_smoke_tests"
service = "app"
run = "curl -f http://localhost:8080/health && curl -f http://localhost:8080/ready"
timeout_seconds = 60

[[expect.span]]
name = "service.health_check"
attrs.all = {
  "health.status" = "healthy"
}

# Graph validation - ensure services interact correctly
[expect.graph]
must_include = [
    ["test.execute", "http.server.request"],
    ["http.server.request", "db.query"]
]
acyclic = true

# Count validation - ensure all tests ran
[expect.counts]
spans_total = { gte = 10 }  # At least 10 spans generated

by_name = {
  "test.execute" = { eq = 3 },        # 3 scenarios
  "container.start" = { eq = 2 },     # app + db
  "container.stop" = { eq = 2 },      # app + db
  "service.health_check" = { gte = 1 }
}

# Status validation - all tests must pass in CI
[expect.status]
by_name = {
  "test.execute" = "OK",           # All tests passed
  "container.start" = "OK",        # All containers started
  "container.stop" = "OK",         # All containers stopped
  "service.health_check" = "OK"    # Health checks passed
}

# Zero errors allowed in CI
errors_total = { eq = 0 }

# Hermeticity - ensure tests don't leak to external services
[expect.hermeticity]
no_external_services = true

span_attrs.forbid_keys = [
  "net.peer.name",  # No external network calls
  "http.url"        # No external HTTP requests
]
