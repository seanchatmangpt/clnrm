# Strict Mode Example - Production Validation
# Validates 100% of telemetry with zero tolerance
# Use for production releases and final certification

[test.metadata]
name = "strict_validation"
version = "1.0.0"
description = "Strict mode validation - comprehensive and thorough"

# Configure strict validation mode
[weaver]
enabled = true
output_dir = "./strict_validation_output"
fail_fast = false  # Collect all violations, don't stop early

[weaver.validation]
mode = "strict"                # 100% validation
fail_on_violations = true      # Block release on violations
fail_on_improvements = true    # Enforce style guidelines

# Performance tuning for comprehensive validation
[weaver.performance]
startup_timeout = "10s"     # Longer timeout for strict mode
flush_timeout = "5s"        # Ensure all telemetry collected
max_samples = 1000000          # No limit on samples

# OTEL configuration - comprehensive instrumentation
[otel]
exporter = "otlp"
protocol = "http/protobuf"
sample_ratio = 1.0  # Sample everything in strict mode

resources = { "service.name" = "strict_validation_test", "service.version" = "1.0.0", "deployment.environment" = "production", "service.namespace" = "clnrm" }

# Custom headers for production environment
headers = { "x-environment" = "production", "x-validation-mode" = "strict" }

# Context propagators
propagators.use = ["tracecontext", "baggage"]

# Service: API Gateway
[service.gateway]
image = "envoyproxy/envoy:v1.28-latest"
env = { "LOG_LEVEL" = "debug" }

# Service: Application Server
[service.app]
image = "app:production"
env = { "ENVIRONMENT" = "production", "LOG_LEVEL" = "info" }

# Service: Database
[service.db]
image = "postgres:15-alpine"
env = { "POSTGRES_PASSWORD" = "prod_password", "POSTGRES_DB" = "production_db" }

# Service: Cache
[service.cache]
image = "redis:7-alpine"

# Scenario: Complete integration test
[[scenario]]
name = "full_integration_test"
service = "app"
run = "./run_integration_tests.sh"

# Comprehensive span validation
[[expect.span]]
name = "test.execute"
kind = "internal"
attrs = { all = { "test.name" = "full_integration_test", "test.isolated" = "true", "test.cleanup_performed" = "true", "container.id" = "*", "deployment.environment" = "production" } }
events = { all = ["test.started", "test.completed"] }
duration_ms = { min = 100.0, max = 30000.0 }

[[expect.span]]
name = "http.server.request"
kind = "server"
parent = "test.execute"
attrs = { all = { "http.method" = "GET", "http.route" = "/api/v1/*", "http.status_code" = "200" } }

[[expect.span]]
name = "db.query"
kind = "client"
parent = "http.server.request"
attrs = { all = { "db.system" = "postgresql", "db.name" = "production_db", "db.operation" = "SELECT" } }

[[expect.span]]
name = "cache.get"
kind = "client"
parent = "http.server.request"
attrs = { all = { "cache.system" = "redis", "cache.operation" = "GET" } }

# Container lifecycle validation
[[expect.span]]
name = "container.lifecycle"
attrs = { all = { "container.created_at" = "*", "container.started_at" = "*", "container.destroyed_at" = "*", "cleanup.success" = "true", "cleanup.orphaned_resources" = "0" } }

# Graph structure validation - ensure proper service interaction
[expect.graph]
must_include = [
    ["test.execute", "http.server.request"],
    ["http.server.request", "db.query"],
    ["http.server.request", "cache.get"]
]
must_not_cross = [
    ["cache.get", "db.query"]  # Cache should not call DB directly
]
acyclic = true  # No cycles in trace

# Temporal ordering - operations must happen in correct sequence
[expect.order]
must_precede = [
    ["container.lifecycle", "test.execute"],
    ["test.execute", "http.server.request"],
    ["http.server.request", "db.query"],
    ["db.query", "http.server.response"]
]

# Temporal window - all operations within test execution window
[[expect.window]]
outer = "test.execute"
contains = [
    "http.server.request",
    "db.query",
    "cache.get",
    "container.lifecycle"
]

# Count validation - exact counts for production
[expect.counts]
spans_total = { gte = 20, lte = 200 }  # Expected span range
events_total = { gte = 10 }            # Minimum events
errors_total = { eq = 0 }              # Zero errors allowed

[expect.counts.by_name]
"test.execute" = { eq = 1 }
"container.lifecycle" = { eq = 4 }    # Gateway, app, db, cache
"http.server.request" = { gte = 5 }   # Multiple requests
"db.query" = { gte = 3 }              # Multiple queries
"cache.get" = { gte = 2 }              # Cache hits

# Status validation - all spans must succeed
[expect.status]
all = "OK"  # No errors allowed in production

# Hermeticity validation - ensure no external leaks
[expect.hermeticity]
no_external_services = true

[expect.hermeticity.resource_attrs]
must_match = { "service.name" = "strict_validation_test", "deployment.environment" = "production" }

[expect.hermeticity.span_attrs]
forbid_keys = ["net.peer.name", "http.url", "db.connection_string"]
