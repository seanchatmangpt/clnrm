# Strict Mode Example - Production Validation]
# Validates 100% of telemetry with zero tolerance]
# Use for production releases and final certification]
]
[test]]
{]
        name = "strict_validation",]
        sample_count = { min = 1 }]
    }]
version = "1.0.0"]
description = "Strict mode validation - comprehensive and thorough"]
]
# OTEL configuration for comprehensive validation]
[otel]]
service_{]
        name = "strict-validation-test",]
        sample_count = { min = 1 }]
    }]
exporter = "otlp-http"]
endpoint = "http://localhost:4318"]
]
# OTEL configuration - comprehensive instrumentation]
[otel]]
service_{]
        name = "strict-validation-test",]
        sample_count = { min = 1 }]
    }]
exporter = "otlp-http"]
endpoint = "http://localhost:4318"]
]
# Container definitions]
[containers.gateway]]
image = "envoyproxy/envoy:v1.28-latest"]
env = { "LOG_LEVEL" = "debug" }]
]
[containers.app]]
image = "app:production"]
env = { "ENVIRONMENT" = "production", "LOG_LEVEL" = "info" }]
]
[containers.db]]
image = "postgres:15-alpine"]
env = { "POSTGRES_PASSWORD" = "prod_password", "POSTGRES_DB" = "production_db" }]
]
# Service: Cache]
[containers.cache]]
image = "redis:7-alpine"]
]
# Scenario: Complete integration test]
[[steps]]]
container = "gateway"]
{]
        name = "full_integration_test",]
        sample_count = { min = 1 }]
    }]
container = "app"]
run = "./run_integration_tests.sh"]
]
# Telemetry validation for strict mode]
[expect.otel]]
spans = []
    {]
        {]
        name = "test.execute",]
        sample_count = { min = 1 }]
    },]
        sample_count = { min = 1 }]
    },]
    {]
        {]
        name = "container.start",]
        sample_count = { min = 1 }]
    },]
        sample_count = { min = 3 }  # gateway, app, db]
    },]
    {]
        {]
        name = "container.stop",]
        sample_count = { min = 1 }]
    },]
        sample_count = { min = 3 }  # gateway, app, db]
    }]
]]
