# 80/20 Mode Example - Recommended for CI/CD
# Validates critical 20% of telemetry for 80% bug coverage
# 6x faster than strict mode

[test]
name = "eighty_twenty_mode"
version = "1.0.0"
description = "80/20 validation mode - fast and effective"

# OTEL configuration for 80/20 validation
[otel]
service_name = "eighty-twenty-test"
exporter = "otlp-http"
endpoint = "http://localhost:4318"

# OTEL configuration
[otel]
exporter = "otlp"
sample_ratio = 1.0  # Always sample in 80/20 mode

resources = { "service.name" = "eighty_twenty_test", "deployment.environment" = "ci" }

# Service: HTTP API
[service.api]
image = "nginx:alpine"
env = { "PORT" = "8080" }

# Service: Database
[service.db]
image = "postgres:15-alpine"
env = { "POSTGRES_PASSWORD" = "testpass", "POSTGRES_DB" = "testdb" }

# Scenario: Health check
[[scenario]]
name = "api_health_check"
service = "api"
run = "curl -f http://localhost:8080/ || exit 1"

# Validate critical spans only (80/20 principle)
[[expect.span]]
name = "test.execute"
attrs = { all = { "test.name" = "api_health_check", "test.isolated" = "true", "container.id" = "*" } }

[[expect.span]]
name = "service.health_check"
attrs = { all = { "service.name" = "api", "health.status" = "healthy" } }

# Validate container lifecycle (critical for cleanup)
[[expect.span]]
name = "container.start"
attrs = { all = { "container.image.name" = "nginx:alpine" } }

[[expect.span]]
name = "container.stop"
attrs = { all = { "container.destroyed_at" = "*", "cleanup.success" = "true" } }

# Count validation - ensure cleanup happened
[expect.counts]

[expect.counts.by_name]
"container.start" = { eq = 2 }  # Started api + db
"container.stop" = { eq = 2 }    # Stopped api + db

# Status validation - all operations succeeded
[expect.status]

[expect.status.by_name]
"test.execute" = "OK"
"container.start" = "OK"
"container.stop" = "OK"
