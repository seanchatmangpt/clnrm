# Basic Weaver Live-Check Example
# This is the simplest possible configuration for live-check validation

[test]
name = "basic_live_check"
version = "1.0.0"
description = "Minimal live-check configuration example"

# OTEL configuration for telemetry validation
[otel]
service_name = "clnrm-basic-test"

# Service definition
[containers.app]
image = "alpine:latest"

# Simple test scenario
[[steps]]
name = "echo_test"
container = "app"
exec = ["echo", "Hello from clnrm"]

# Validate that test executed in container with telemetry
[[expect.otel.spans]]
name = "test.execute"
sample_count = { min = 1 }