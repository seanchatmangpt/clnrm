# Weaver Live-Checking TOML Configuration Example
#
# This example demonstrates how to configure Weaver live-checking
# directly in your TOML test files.

[test]
name = "weaver_validation_example"
version = "1.0.0"
description = "Example test with Weaver live-checking enabled"

# OTEL configuration for Weaver validation
[otel]
service_name = "weaver-validation-example"
exporter = "otlp-http"
endpoint = "http://localhost:4318"

# Container definition
[containers.test_service]
image = "alpine:latest"

# Test steps
[[steps]]
name = "validate_telemetry"
container = "test_service"
exec = ["echo", "This will emit telemetry to Weaver for validation"]

# Expectations for telemetry validation
[[expect.otel.spans]]
name = "test.execute"
sample_count = { min = 1 }
