# CI/CD Integration Example
# This demonstrates template configuration for continuous integration pipelines
#
# Example: After template processing with ENV defaults:
# CI='false', CI_JOB_ID='local', GIT_COMMIT='unknown'

[vars]
ci = "false"
ci_job_id = "local"
git_commit = "unknown"
service_name = "clnrm"

[test.metadata]
name = "ci_integration_test"
description = "Test configured for CI/CD pipeline execution"
created_at = "2025-01-01T00:00:00Z"

# OTEL configuration - using static values as template example
# In actual use, Tera would process conditionals before TOML parsing
[otel]
exporter = "stdout"

[otel.resources]
"service.name" = "clnrm"
"ci.job.id" = "local"
"git.commit.sha" = "unknown"
"test.run.id" = "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"

# Determinism configuration for CI environments
[determinism]
seed = 42
freeze_clock = "2025-01-01T00:00:00Z"

[[scenario]]
name = "test_basic_functionality"
service = "alpine"
run = """
echo 'CI Job: local'
echo 'Git Commit: unknown'
echo 'Timestamp: 2025-01-01T00:00:00Z'
"""

[services.alpine]
type = "generic_container"
image = "alpine:latest"

[[expect.span]]
name = "clnrm.step:test_basic_functionality"

[expect.span.attributes]
any = { "ci.job.id" = "local" }

[expect.status]
all = "OK"

# CI-specific reporting configuration
# Example: After template processing with ci_job_id='local'
[report]
json = "results/ci-report-local.json"
junit = "results/junit-local.xml"
digest = "results/test-local.digest"

# CI-specific resource limits
[limits]
cpu_millicores = 2000  # 2 CPUs in CI
memory_mb = 4096       # 4 GB in CI
