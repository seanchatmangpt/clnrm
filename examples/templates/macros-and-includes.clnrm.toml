# Macros and Includes Example
# This demonstrates reusable template blocks via macros
# Note: Tera macros are processed before TOML parsing, so this shows the conceptual usage

[vars]
service_name = "clnrm"

[test.metadata]
name = "macros_example"
description = "Demonstrates Tera macros for reusable template blocks"

# OTEL configuration - in actual use, would be generated by macro
[otel]
exporter = "stdout"

[otel.resources]
"service.name" = "clnrm"

[[scenario]]
name = "fast_operation"
service = "alpine"
run = "echo 'Fast operation'"

[[scenario]]
name = "slow_operation"
service = "alpine"
run = "sleep 0.5 && echo 'Slow operation'"

[services.alpine]
type = "generic_container"
image = "alpine:latest"

# Span expectations - in actual use, would be generated by macros
[[expect.span]]
name = "clnrm.step:fast_operation"

[expect.span.attributes]
all = { "duration_check" = "fast" }

[expect.span.events]
any = ["container.start", "container.exec", "container.stop"]

[[expect.span]]
name = "clnrm.step:slow_operation"

[expect.span.attributes]
all = { "duration_check" = "slow" }

[expect.span.events]
any = ["container.start", "container.exec", "container.stop"]

[expect.status]
all = "OK"
