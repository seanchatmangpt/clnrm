# Environment Variable Resolution Demo Template
#
# This demonstrates automatic ENV variable resolution following
# the precedence chain: vars → ENV → defaults
#
# NOTE: This file shows the AFTER Tera processing with default values
# The original used {{ var }} interpolations that would be resolved from ENV
#
# Example resolved values (from defaults):
# - SERVICE_NAME → "clnrm"
# - ENV → "ci"
# - OTEL_ENDPOINT → "http://localhost:4318"
# - OTEL_TRACES_EXPORTER → "otlp"
# - CLNRM_IMAGE → "registry/clnrm:1.0.0"
# - FREEZE_CLOCK → "2025-01-01T00:00:00Z"
# - OTEL_TOKEN → "" (empty, so no auth header section)

[test.metadata]
name = "clnrm_env_demo"
version = "1.0.0"
description = "Demonstrates ENV variable resolution in templates"

# OpenTelemetry Configuration
# Uses ENV variables with fallback to defaults
[otel]
exporter = "otlp"
endpoint = "http://localhost:4318"
sample_ratio = 1.0

[otel.resources]
"service.name" = "clnrm"
"service.version" = "1.0.0"
"deployment.environment" = "ci"
"test.framework" = "clnrm"

# Conditional header based on token availability
# Note: With OTEL_TOKEN="" (empty), no headers section is included
# If OTEL_TOKEN was set, this would appear:
# [otel.headers]
# "Authorization" = "Bearer <token>"
# "X-Service-Name" = "clnrm"

# Propagators configuration
[otel.propagators]
use = ["tracecontext", "baggage"]

# Service Definition
# Uses CLNRM_IMAGE ENV variable for container image
[service.test_runner]
image = "registry/clnrm:1.0.0"
args = ["sh", "-c", "echo 'Running test in ci environment'"]
wait_for_span = "test_runner.start"

# Environment-specific configuration using conditionals
# Example: CI/Development settings (env != "production" and env != "staging")
[service.test_runner.health_check]
interval = "2s"
timeout = "10s"
retries = 2

# Note: For staging (env == "staging"), this would be:
# interval = "10s"
# timeout = "60s"
# retries = 3
#
# For production (env == "production"), this would be:
# interval = "5s"
# timeout = "30s"
# retries = 5

# Test Scenarios
[[scenario]]
name = "verify_environment"
service = "test_runner"
run = "echo 'Service: clnrm, Env: ci, Endpoint: http://localhost:4318'"

[[scenario]]
name = "check_determinism"
service = "test_runner"
run = "date && echo 'Frozen at: 2025-01-01T00:00:00Z'"

[[scenario]]
name = "test_otel_export"
service = "test_runner"
run = "echo 'Exporting to otlp at http://localhost:4318'"

# Span Expectations
# Verify expected telemetry was produced
[[expect.span]]
name = "test_runner.start"
kind = "server"

[expect.span.attrs.all]
"service.name" = "clnrm"
"deployment.environment" = "ci"

[[expect.span]]
name = "test_runner.exec"
kind = "internal"

[expect.span.attrs.any]
"exec.command" = "echo"

[[expect.span]]
name = "test_runner.stop"
kind = "server"

[expect.span.attrs.all]
"container.state" = "stopped"

# Temporal ordering expectations
[expect.order]
must_precede = [
    ["test_runner.start", "test_runner.exec"],
    ["test_runner.exec", "test_runner.stop"]
]

# Status expectations
[expect.status]
all = "ok"
by_name."test_runner.*" = "ok"

# Count expectations
[expect.counts]
spans_total = { gte = 3 }
errors_total = { eq = 0 }
spans_by_kind.server = { gte = 2 }
spans_by_kind.internal = { gte = 1 }

# Deterministic Configuration
# Uses FREEZE_CLOCK ENV variable
[determinism]
seed = 42
freeze_clock = "2025-01-01T00:00:00Z"

# Resource Limits
# Adjust based on environment
# Example: CI/dev environment (env != "production")
[limits]
cpu_millicores = 500
memory_mb = 512

# Note: For production (env == "production"), this would be:
# cpu_millicores = 1000
# memory_mb = 1024

# Reporting Configuration
# Paths include service name and environment
[report]
json = "reports/clnrm_ci_report.json"
junit = "reports/clnrm_ci_junit.xml"
digest = "reports/clnrm_ci_digest.sha256"
