# Matrix Expansion Example
# This demonstrates using Tera loops to generate multiple scenarios from a matrix

[vars]
service_name = "clnrm"

[template.matrix]
exporters = [
    { name = "stdout", endpoint = "", requires_endpoint = false },
    { name = "otlp", endpoint = "http://localhost:4318", requires_endpoint = true },
    { name = "jaeger", endpoint = "http://localhost:14250", requires_endpoint = true }
]

[test.metadata]
name = "matrix_expansion_test"
description = "Test with multiple OTEL exporters via matrix expansion"

[services.alpine]
type = "generic_container"
image = "alpine:latest"

# Example scenario - Tera template would generate multiple scenarios from matrix
# For demonstration, showing one static scenario as Tera processing happens pre-TOML
[[scenario]]
name = "test_stdout"
service = "alpine"
run = "echo 'Testing with stdout exporter'"

[otel]
exporter = "stdout"

[otel.resources]
"service.name" = "clnrm"
"exporter.type" = "stdout"

# Static span expectation - Tera would generate one per exporter
[[expect.span]]
name = "clnrm.step:test_stdout"

[expect.span.attributes]
any = { "exporter.type" = "stdout" }

[expect.counts]
spans.min = 1
spans.max = 1
