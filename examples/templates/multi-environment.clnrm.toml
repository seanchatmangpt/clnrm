# Multi-Environment Testing Example
# This demonstrates environment-specific configurations with conditionals
#
# NOTE: This file shows the template AFTER Tera processing with vars.env='dev'
# The original template had {% if %} conditionals that would be evaluated during processing
# For other environments (staging/prod), different sections would be included

[vars]
env = "dev"  # Resolved from env(name='TEST_ENV', default='dev')
service_name = "clnrm"

# Environment metadata (not used in TOML processing)
# Original template had these endpoint options for different environments
[metadata.env_options]
dev_endpoint = "http://localhost:4318"
staging_endpoint = "http://staging-otel:4318"
prod_endpoint = "http://prod-otel:4318"

[test.metadata]
name = "multi_env_test_dev"
description = "Environment-specific test configuration"

# Environment-specific OTEL configuration
# Example: Development environment configuration (vars.env == "dev")
[otel]
exporter = "stdout"

[otel.resources]
"service.name" = "clnrm-dev"
"deployment.environment" = "development"

# Development: No determinism (use real time)
# Note: staging and prod would have [determinism] sections with seed=42

# Note: Production environment would also include:
# [limits]
# cpu_millicores = 4000
# memory_mb = 8192

[[scenario]]
name = "test_dev_scenario"
service = "alpine"
run = "echo 'Running in dev environment'"

[services.alpine]
type = "generic_container"
image = "alpine:latest"

[[expect.span]]
name = "clnrm.step:test_dev_scenario"

[expect.span.attributes.any]
"deployment.environment" = "development"

# Environment-specific reporting
# Note: In dev mode, no report section is included
# staging/prod would have:
# [report]
# json = "results/staging-report.json"
# junit = "results/staging-junit.xml"
# digest = "results/staging.digest"
