# README Example Validation
# This file validates that all features shown in the README example
# actually work in a real clnrm TOML file.
#
# Run: clnrm validate examples/readme-example-validation.clnrm.toml

[test]
name = "api_with_database"
description = "Test API integration with database"

[containers.api]
image = "nginx:alpine"
ports = [80, 443]
env = { "API_KEY" = "secret", "LOG_LEVEL" = "info" }

[containers.database]
image = "postgres:15-alpine"
ports = [5432]
env = { POSTGRES_DB = "testdb", POSTGRES_USER = "testuser", POSTGRES_PASSWORD = "testpass" }

[[steps]]
name = "check_db"
container = "database"
exec = ["pg_isready", "-U", "testuser"]

[[steps]]
name = "run_tests"
container = "api"
exec = ["echo", "API tests would run here"]

# Basic telemetry validation
[[expect.otel.spans]]
name = "test.execute"
sample_count = { min = 2 }
