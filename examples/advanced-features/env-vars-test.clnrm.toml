# Environment Variables Test - New Canonical Format
#
# This test validates that environment variables defined in [containers.X]
# are properly passed to the container and available during `docker exec`.
#
# CRITICAL: This is the definitive test for the v2 architecture fix.
# Prior to v2, execute_in_service() created NEW containers, so env vars
# defined on the original container were lost. v2 uses docker exec semantics.

[test]
name = "env_vars_validation"
description = "Validates environment variables are available in docker exec"
timeout = "30s"

[containers.alpine]
image = "alpine:latest"
env = { MY_VAR = "hello_world", ANOTHER_VAR = "test_value", DB_HOST = "localhost" }
# Keep container running with a sleep loop
exec = ["sh", "-c", "while true; do sleep 1; done"]

[[steps]]
name = "verify_my_var"
container = "alpine"
exec = ["sh", "-c", "echo $MY_VAR"]
[steps.assert]
exit_code = 0
stdout_contains = "hello_world"

[[steps]]
name = "verify_another_var"
container = "alpine"
exec = ["sh", "-c", "echo $ANOTHER_VAR"]
depends_on = ["verify_my_var"]
[steps.assert]
exit_code = 0
stdout_contains = "test_value"

[[steps]]
name = "verify_db_host"
container = "alpine"
exec = ["sh", "-c", "echo $DB_HOST"]
depends_on = ["verify_another_var"]
[steps.assert]
exit_code = 0
stdout_contains = "localhost"

[[steps]]
name = "verify_all_vars_in_one"
container = "alpine"
exec = ["sh", "-c", "echo MY_VAR=$MY_VAR ANOTHER_VAR=$ANOTHER_VAR DB_HOST=$DB_HOST"]
depends_on = ["verify_db_host"]
[steps.assert]
exit_code = 0
stdout_contains = "MY_VAR=hello_world"
