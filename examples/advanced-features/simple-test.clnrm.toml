# Simple Test - Minimal working example
# This demonstrates the correct TOML format for the CLI

[test]
name = "simple_test"
description = "A simple test to verify CLI functionality"

[containers.test_container]
image = "alpine:latest"

[[steps]]
container = "test_container"
name = "hello_world"
exec = ["echo", "Hello, World!"]
assert.stdout_contains = "Hello, World!"
