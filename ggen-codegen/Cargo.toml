[package]
name = "ggen-codegen"
version = "0.1.0"
edition = "2021"

[dependencies]
# RDF/Semantic Web
oxigraph = "0.3"
oxrdf = "0.1"

# Templating
tera = "1.19"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Async runtime
tokio = { version = "1.0", features = ["full"] }

# File I/O
walkdir = "2.4"
regex = "1.10"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# CLI
clap = { version = "4.4", features = ["derive"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# YAML for schema
yaml-rust = "0.4"

# UUID for generation
uuid = { version = "1.0", features = ["v4"] }
chrono = "0.4"

[[bin]]
name = "ggen"
path = "src/main.rs"

[lib]
name = "ggen_codegen"
path = "src/lib.rs"
