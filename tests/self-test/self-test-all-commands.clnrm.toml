# ASSERTIONS
# ===================================================================

[assertions]
# Basic commands should work
container_should_have_executed_commands = 20
execution_should_be_hermetic = true

# Critical: Test that actually PROVE commands work
# (not just that --help returns text)
test_version_should_return_version_number = true
test_init_should_create_files = true
test_health_should_pass = true

