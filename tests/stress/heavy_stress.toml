# Heavy Stress Test Configuration
#
# This configuration runs a heavy-intensity stress test designed for
# production validation and performance benchmarking.
# Requires substantial system resources.

# Container images to test - comprehensive coverage
containers = [
    "alpine:latest",
    "alpine:3.18",
    "ubuntu:latest",
    "ubuntu:22.04",
    "debian:stable-slim",
    "debian:bookworm-slim"
]

# Number of test iterations per container
test_count = 50

# OTEL span depth (how many nested spans to generate)
span_depth = 15

# Parallel execution concurrency level
concurrency = 8

# Test timeout per execution (seconds)
test_timeout = 300

# Enable progress reporting
progress_reporting = true

# Enable graceful degradation on resource exhaustion
graceful_degradation = true

# Fail fast on first error
fail_fast = false

[limits]
# Maximum number of concurrent containers
max_containers = 30

# Maximum memory usage in MB
max_memory_mb = 8192

# Maximum CPU cores to use
max_cpu_cores = 8.0

# Maximum total OTEL spans to generate
max_spans = 100000

# Container startup timeout (seconds)
container_startup_timeout = 60

# Pool cleanup timeout (seconds)
pool_cleanup_timeout = 120
