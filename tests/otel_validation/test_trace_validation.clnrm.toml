# OpenTelemetry Trace Structure Validation
#
# This test validates trace structure, parent-child relationships, and trace completeness.
# Ensures spans form proper hierarchies with correct trace IDs and parent/child relationships.

[test.metadata]
name = "otel_trace_validation"
description = "Validate trace structure and parent-child span relationships"
timeout = "30s"

# Service configuration
[services.trace_test_service]
type = "generic_container"
plugin = "generic_container"
image = "alpine:latest"

# Steps to create hierarchical span structure
[[steps]]
name = "root_operation"
service = "trace_test_service"
command = ["echo", "Root operation"]
expected_output_regex = "Root operation"
expected_exit_code = 0

[[steps]]
name = "child_operation_1"
service = "trace_test_service"
command = ["echo", "Child operation 1"]
expected_output_regex = "Child operation 1"
expected_exit_code = 0

[[steps]]
name = "child_operation_2"
service = "trace_test_service"
command = ["sh", "-c", "echo 'Child operation 2' && sleep 0.1"]
expected_output_regex = "Child operation 2"
expected_exit_code = 0

# OTEL Validation Configuration
[otel_validation]
enabled = true
validate_spans = true
validate_traces = true

# Expected trace structure with parent-child relationships
[[otel_validation.expected_traces]]
complete = true
span_names = ["clnrm.run", "clnrm.test", "clnrm.step", "clnrm.container.exec"]

# Parent-child relationships to validate
[[otel_validation.expected_traces.parent_child]]
parent = "clnrm.run"
child = "clnrm.test"

[[otel_validation.expected_traces.parent_child]]
parent = "clnrm.test"
child = "clnrm.step"

[[otel_validation.expected_traces.parent_child]]
parent = "clnrm.step"
child = "clnrm.container.exec"

# Expected spans with hierarchy validation
[[otel_validation.expected_spans]]
name = "clnrm.run"
required = true

[[otel_validation.expected_spans]]
name = "clnrm.test"
required = true

[[otel_validation.expected_spans]]
name = "clnrm.step"
required = true

# Validate step spans exist for each executed step
[[otel_validation.expected_spans]]
name = "clnrm.step"
required = true

[otel_validation.expected_spans.attributes]
"step.name" = "root_operation"

[[otel_validation.expected_spans]]
name = "clnrm.step"
required = true

[otel_validation.expected_spans.attributes]
"step.name" = "child_operation_1"

[[otel_validation.expected_spans]]
name = "clnrm.step"
required = true

[otel_validation.expected_spans.attributes]
"step.name" = "child_operation_2"

# Assertions
[assertions]
container_should_have_executed_commands = 3
execution_should_be_hermetic = true
trace_id_matches_across_spans = true
parent_span_ids_are_valid = true

# Trace completeness validation
[assertions.trace_validation]
all_spans_have_same_trace_id = true
parent_child_relationships_valid = true
no_orphaned_spans = true
trace_duration_realistic = true
