# End-to-End OTEL Validation
#
# This test provides comprehensive end-to-end validation of the entire OTEL integration.
# Combines span generation, trace structure, export, and fake-green detection.
#
# This is the "master validation" that proves clnrm's OTEL integration is production-ready.

[test.metadata]
name = "otel_end_to_end_validation"
description = "Comprehensive end-to-end OTEL validation with all checks enabled"
timeout = "60s"

# Service configuration - Multi-service test
[services.primary_service]
type = "generic_container"
image = "alpine:latest"

[services.primary_service.env]
SERVICE_TYPE = "primary"

[services.secondary_service]
type = "generic_container"
image = "alpine:latest"

[services.secondary_service.env]
SERVICE_TYPE = "secondary"

# Complex test scenario with multiple services and operations
[[steps]]
name = "initialize_primary"
service = "primary_service"
command = ["echo", "Primary service initialized"]
expected_output_regex = "Primary service initialized"
expected_exit_code = 0

[[steps]]
name = "initialize_secondary"
service = "secondary_service"
command = ["echo", "Secondary service initialized"]
expected_output_regex = "Secondary service initialized"
expected_exit_code = 0

[[steps]]
name = "primary_operation_1"
service = "primary_service"
command = ["sh", "-c", "echo 'Primary operation 1' && sleep 0.05"]
expected_output_regex = "Primary operation 1"
expected_exit_code = 0

[[steps]]
name = "secondary_operation_1"
service = "secondary_service"
command = ["sh", "-c", "echo 'Secondary operation 1' && sleep 0.05"]
expected_output_regex = "Secondary operation 1"
expected_exit_code = 0

[[steps]]
name = "primary_operation_2"
service = "primary_service"
command = ["sh", "-c", "echo 'Primary operation 2' && date"]
expected_output_regex = "Primary operation 2"
expected_exit_code = 0

[[steps]]
name = "secondary_operation_2"
service = "secondary_service"
command = ["sh", "-c", "echo 'Secondary operation 2' && date"]
expected_output_regex = "Secondary operation 2"
expected_exit_code = 0

[[steps]]
name = "cleanup_primary"
service = "primary_service"
command = ["echo", "Primary cleanup"]
expected_output_regex = "Primary cleanup"
expected_exit_code = 0

[[steps]]
name = "cleanup_secondary"
service = "secondary_service"
command = ["echo", "Secondary cleanup"]
expected_output_regex = "Secondary cleanup"
expected_exit_code = 0

# Comprehensive OTEL Validation Configuration
[otel_validation]
enabled = true
validate_spans = true
validate_traces = true
validate_exports = true
validate_performance = true
strict_mode = true

# Fake-green detection enabled
[otel_validation.fake_green_detection]
enabled = true
validate_exact_span_count = true
validate_span_timing = true
validate_span_attributes = true
validate_no_duplicate_span_ids = true
validate_timestamp_ordering = true
validate_temporal_hierarchy = true

# Performance validation
[otel_validation.performance]
max_overhead_ms = 200.0
baseline_duration_ms = 1000.0

# Export validation
[otel_validation.export]
exporter_type = "stdout_ndjson"
validate_format = true
validate_required_fields = true

# Expected trace structure
[[otel_validation.expected_traces]]
complete = true
span_names = ["clnrm.run", "clnrm.test", "clnrm.service.start", "clnrm.step", "clnrm.container.exec"]

# Parent-child relationships
[[otel_validation.expected_traces.parent_child]]
parent = "clnrm.run"
child = "clnrm.test"

[[otel_validation.expected_traces.parent_child]]
parent = "clnrm.test"
child = "clnrm.service.start"

[[otel_validation.expected_traces.parent_child]]
parent = "clnrm.test"
child = "clnrm.step"

[[otel_validation.expected_traces.parent_child]]
parent = "clnrm.step"
child = "clnrm.container.exec"

# Expected spans - Full coverage
[[otel_validation.expected_spans]]
name = "clnrm.run"
required = true
should_be_exported = true

[otel_validation.expected_spans.attributes]
"component" = "runner"
"otel.kind" = "internal"

[[otel_validation.expected_spans]]
name = "clnrm.test"
required = true
should_be_exported = true

[otel_validation.expected_spans.attributes]
"test.name" = "otel_end_to_end_validation"
"test.hermetic" = "true"

[[otel_validation.expected_spans]]
name = "clnrm.service.start"
required = true
count_min = 2  # At least 2 service starts (primary + secondary)

[[otel_validation.expected_spans]]
name = "clnrm.step"
required = true
count_exact = 8  # Exactly 8 steps defined

[[otel_validation.expected_spans]]
name = "clnrm.container.exec"
required = true
count_exact = 8  # Exactly 8 commands executed

# Comprehensive assertions
[assertions]
container_should_have_executed_commands = 8
execution_should_be_hermetic = true
all_services_started = true
all_steps_should_succeed = true

# Span validation assertions
[assertions.span_validation]
all_expected_spans_present = true
span_count_matches_execution = true
span_attributes_are_accurate = true
no_missing_spans = true
no_extra_spans = true

# Trace validation assertions
[assertions.trace_validation]
trace_structure_is_correct = true
all_spans_have_same_trace_id = true
parent_child_relationships_valid = true
trace_is_complete = true
no_orphaned_spans = true

# Export validation assertions
[assertions.export_validation]
all_spans_exported = true
export_format_valid = true
export_has_required_fields = true
trace_ids_valid = true
span_ids_valid = true

# Performance assertions
[assertions.performance_validation]
overhead_within_limits = true
span_generation_performant = true
export_performant = true

# Critical fake-green detection assertions
[assertions.fake_green_detection]
# Span count validation
span_count_equals_command_count = true
no_missing_command_spans = true
no_spurious_spans = true

# Timing validation
all_spans_have_realistic_duration = true
no_zero_duration_spans = true
timestamps_are_monotonic = true
child_spans_within_parent_timeframe = true

# Data integrity validation
no_duplicate_span_ids = true
no_invalid_trace_ids = true
all_required_attributes_present = true
span_attributes_match_execution = true

# Temporal validation
spans_in_execution_order = true
service_spans_before_step_spans = true
step_spans_before_exec_spans = true
cleanup_spans_after_operation_spans = true

# End-to-end validation
full_workflow_captured = true
no_telemetry_gaps = true
observability_complete = true
production_ready = true
