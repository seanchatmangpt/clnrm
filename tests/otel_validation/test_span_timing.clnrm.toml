# OpenTelemetry Span Timing Validation
#
# This test validates that span timing is accurate and realistic.
# Detects spans with incorrect durations, zero-duration spans, and timing anomalies.

[test.metadata]
name = "otel_span_timing"
description = "Validate span timing accuracy and detect timing anomalies"
timeout = "30s"

# Service configuration
[services.timing_test]
type = "generic_container"
plugin = "generic_container"
image = "alpine:latest"

# Execute commands with known durations to validate span timing
[[steps]]
name = "instant_command"
service = "timing_test"
command = ["echo", "Instant"]
expected_output_regex = "Instant"
expected_exit_code = 0
# Expected duration: < 10ms

[[steps]]
name = "short_delay"
service = "timing_test"
command = ["sh", "-c", "sleep 0.05 && echo 'Short delay'"]
expected_output_regex = "Short delay"
expected_exit_code = 0
# Expected duration: ~50ms ± 20ms

[[steps]]
name = "medium_delay"
service = "timing_test"
command = ["sh", "-c", "sleep 0.1 && echo 'Medium delay'"]
expected_output_regex = "Medium delay"
expected_exit_code = 0
# Expected duration: ~100ms ± 30ms

[[steps]]
name = "long_delay"
service = "timing_test"
command = ["sh", "-c", "sleep 0.2 && echo 'Long delay'"]
expected_output_regex = "Long delay"
expected_exit_code = 0
# Expected duration: ~200ms ± 50ms

# OTEL Validation Configuration
[otel_validation]
enabled = true
validate_spans = true
validate_performance = true
strict_mode = true

# Timing validation configuration
[otel_validation.timing]
validate_duration_accuracy = true
allow_timing_variance_percent = 30.0  # Allow ±30% variance
min_realistic_duration_ms = 0.001  # 1 microsecond minimum
max_realistic_duration_ms = 10000.0  # 10 seconds maximum

# Expected spans with timing constraints
[[otel_validation.expected_spans]]
name = "clnrm.step"
required = true

[otel_validation.expected_spans.attributes]
"step.name" = "instant_command"

# Instant command should complete in < 10ms
[otel_validation.expected_spans.timing]
max_duration_ms = 10.0

[[otel_validation.expected_spans]]
name = "clnrm.step"
required = true

[otel_validation.expected_spans.attributes]
"step.name" = "short_delay"

# Short delay should be ~50ms
[otel_validation.expected_spans.timing]
min_duration_ms = 30.0  # 50ms - 40% tolerance
max_duration_ms = 80.0  # 50ms + 60% tolerance

[[otel_validation.expected_spans]]
name = "clnrm.step"
required = true

[otel_validation.expected_spans.attributes]
"step.name" = "medium_delay"

# Medium delay should be ~100ms
[otel_validation.expected_spans.timing]
min_duration_ms = 70.0   # 100ms - 30%
max_duration_ms = 150.0  # 100ms + 50%

[[otel_validation.expected_spans]]
name = "clnrm.step"
required = true

[otel_validation.expected_spans.attributes]
"step.name" = "long_delay"

# Long delay should be ~200ms
[otel_validation.expected_spans.timing]
min_duration_ms = 150.0  # 200ms - 25%
max_duration_ms = 300.0  # 200ms + 50%

# Assertions
[assertions]
container_should_have_executed_commands = 4
execution_should_be_hermetic = true

# Timing validation assertions
[assertions.timing_validation]
all_spans_have_positive_duration = true
no_zero_duration_spans = true
no_negative_duration_spans = true
span_durations_are_realistic = true

# Duration accuracy assertions
[assertions.duration_accuracy]
instant_command_duration_under_10ms = true
short_delay_duration_approximately_50ms = true
medium_delay_duration_approximately_100ms = true
long_delay_duration_approximately_200ms = true

# Temporal ordering assertions
[assertions.temporal_ordering]
spans_ordered_by_start_time = true
no_overlapping_sequential_steps = true
parent_spans_contain_child_spans = true
step_durations_sum_to_test_duration = true

# Fake-green detection via timing
[assertions.fake_green_detection]
# If span claims 0ms but sleep 200ms, that's fake
duration_matches_sleep_commands = true
no_suspiciously_fast_operations = true
no_unrealistic_timing_precision = true
variance_within_acceptable_range = true
