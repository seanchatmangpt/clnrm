# Cleanroom Test Definition
# Generated by clnrm init (v2.0.0 format)

[test]
name = "basic_test"
description = "Basic integration test"
timeout = "120s"

[containers.test_container]
image = "alpine:latest"

[[steps]]
name = "hello_world"
container = "test_container"
exec = ["echo", "Hello from cleanroom!"]
assert.stdout_contains = "Hello from cleanroom!"

[[steps]]
name = "verify_environment"
container = "test_container"
exec = ["uname", "-s"]
assert.stdout_contains = "Linux"
