version: '3.8'

# Docker Compose configuration for integration testing with gVisor runtime
# This file defines the test environment infrastructure with gVisor sandbox isolation
# TOYOTA PRODUCTION SYSTEM: Standardization + Muda Elimination + Heijunka (Load Leveling)

services:
  # SurrealDB - Primary database for integration tests [gVisor: runsc]
  surrealdb:
    image: surrealdb/surrealdb:latest
    runtime: runsc
    container_name: clnrm-test-surrealdb
    command: start --log trace --user root --pass root memory
    ports:
      - "8000:8000"
    environment:
      - SURREAL_LOG=trace
      - SURREAL_STRICT=true
    security_opt:
      - apparmor=unconfined
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
    resources:
      limits:
        cpus: '1.0'
        memory: 512M
      reservations:
        cpus: '0.5'
        memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - clnrm-test-network

  # OpenTelemetry Collector - Observability backend [gVisor: runsc]
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    runtime: runsc
    container_name: clnrm-test-otel-collector
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./otel-collector-config.yml:/etc/otel-collector-config.yml:ro
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
      - "8888:8888"   # Prometheus metrics
      - "13133:13133" # Health check
    environment:
      - OTEL_LOG_LEVEL=debug
    security_opt:
      - apparmor=unconfined
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
    resources:
      limits:
        cpus: '1.5'
        memory: 768M
      reservations:
        cpus: '0.75'
        memory: 384M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:13133/"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - clnrm-test-network
    depends_on:
      - jaeger

  # Jaeger - Distributed tracing UI [gVisor: runsc]
  jaeger:
    image: jaegertracing/all-in-one:latest
    runtime: runsc
    container_name: clnrm-test-jaeger
    ports:
      - "16686:16686" # Jaeger UI
      - "14250:14250" # gRPC receiver
      - "14268:14268" # HTTP receiver
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - LOG_LEVEL=debug
    security_opt:
      - apparmor=unconfined
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
    resources:
      limits:
        cpus: '1.0'
        memory: 512M
      reservations:
        cpus: '0.5'
        memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:14269/"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - clnrm-test-network

  # Prometheus - Metrics storage and querying [gVisor: runsc]
  prometheus:
    image: prom/prometheus:latest
    runtime: runsc
    container_name: clnrm-test-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    volumes:
      - ./prometheus-config.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    security_opt:
      - apparmor=unconfined
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
    resources:
      limits:
        cpus: '1.0'
        memory: 512M
      reservations:
        cpus: '0.5'
        memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - clnrm-test-network

  # Alpine - Lightweight container for basic tests [gVisor: runsc]
  alpine:
    image: alpine:latest
    runtime: runsc
    container_name: clnrm-test-alpine
    command: ["tail", "-f", "/dev/null"]  # Keep container running
    security_opt:
      - apparmor=unconfined
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    resources:
      limits:
        cpus: '0.5'
        memory: 128M
      reservations:
        cpus: '0.25'
        memory: 64M
    networks:
      - clnrm-test-network

  # Ubuntu - Full-featured container for complex tests [gVisor: runsc]
  ubuntu:
    image: ubuntu:22.04
    runtime: runsc
    container_name: clnrm-test-ubuntu
    command: ["tail", "-f", "/dev/null"]  # Keep container running
    security_opt:
      - apparmor=unconfined
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - KILL
    resources:
      limits:
        cpus: '1.0'
        memory: 256M
      reservations:
        cpus: '0.5'
        memory: 128M
    networks:
      - clnrm-test-network

  # Redis - Cache and state management for tests [gVisor: runsc]
  redis:
    image: redis:alpine
    runtime: runsc
    container_name: clnrm-test-redis
    ports:
      - "6379:6379"
    security_opt:
      - apparmor=unconfined
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
    resources:
      limits:
        cpus: '0.75'
        memory: 256M
      reservations:
        cpus: '0.375'
        memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - clnrm-test-network

  # PostgreSQL - Alternative database for compatibility tests [gVisor: runsc]
  postgres:
    image: postgres:15-alpine
    runtime: runsc
    container_name: clnrm-test-postgres
    environment:
      - POSTGRES_DB=clnrm_test
      - POSTGRES_USER=test_user
      - POSTGRES_PASSWORD=test_password
    ports:
      - "5432:5432"
    security_opt:
      - apparmor=unconfined
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
    resources:
      limits:
        cpus: '1.5'
        memory: 512M
      reservations:
        cpus: '0.75'
        memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - clnrm-test-network

  # Mock API Server - Simulates external APIs [gVisor: runsc]
  mock-api:
    image: mockserver/mockserver:latest
    runtime: runsc
    container_name: clnrm-test-mock-api
    ports:
      - "1080:1080"
    environment:
      - MOCKSERVER_LOG_LEVEL=INFO
    security_opt:
      - apparmor=unconfined
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
    resources:
      limits:
        cpus: '1.0'
        memory: 384M
      reservations:
        cpus: '0.5'
        memory: 192M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1080/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - clnrm-test-network

networks:
  clnrm-test-network:
    driver: bridge
    name: clnrm-test-network

volumes:
  prometheus-data:
    name: clnrm-test-prometheus-data
    driver: local
  postgres-data:
    name: clnrm-test-postgres-data
    driver: local

# gVisor STANDARDIZATION COMPLETE
# All services now use runtime: runsc with:
# - Minimal required capabilities (CAP_DROP: ALL)
# - Balanced resource allocation (HEIJUNKA principle)
# - gVisor-compatible volumes and networking
#
# Usage:
# Start all services with gVisor:
#   docker-compose -f tests/integration/docker-compose.test.yml up -d
#
# Start specific service:
#   docker-compose -f tests/integration/docker-compose.test.yml up -d surrealdb
#
# View logs:
#   docker-compose -f tests/integration/docker-compose.test.yml logs -f
#
# Stop all services:
#   docker-compose -f tests/integration/docker-compose.test.yml down
#
# Stop and remove volumes:
#   docker-compose -f tests/integration/docker-compose.test.yml down -v
#
# Check service health:
#   docker-compose -f tests/integration/docker-compose.test.yml ps
#
# gVisor Runtime Validation: Verify runsc is installed
#   docker run --runtime=runsc --rm hello-world
