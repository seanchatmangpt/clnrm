version: '3.8'

# gVisor Compose configuration for integration testing
# This file defines the test environment infrastructure using gVisor runtime
# for enhanced security and isolation
#
# GENCHI GENBUTSU: See actual test execution in gVisor sandbox
# STANDARDIZATION: All tests run with consistent gVisor isolation
# HEIJUNKA: Load balanced across gVisor runsc workers
#
# To run with gVisor:
# DOCKER_RUNTIME=runsc docker-compose -f tests/integration/gvisor-compose.test.yml up -d
#
# Note: Ensure gVisor (runsc) is installed and configured:
# sudo apt-get install runsc  # For gVisor installation
# docker run --runtime=runsc --rm alpine echo "Hello from gVisor!"

services:
  # SurrealDB - Primary database for integration tests
  # Running in gVisor sandbox for security isolation
  surrealdb:
    image: surrealdb/surrealdb:latest
    container_name: clnrm-test-surrealdb-gvisor
    command: start --log trace --user root --pass root memory
    runtime: runsc  # gVisor runtime
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - "apparmor=unconfined"
    ports:
      - "8000:8000"
    environment:
      - SURREAL_LOG=trace
      - SURREAL_STRICT=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - clnrm-test-network-gvisor
    labels:
      security: high
      isolation: gvisor

  # OpenTelemetry Collector - Observability backend
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: clnrm-test-otel-collector-gvisor
    command: ["--config=/etc/otel-collector-config.yml"]
    runtime: runsc  # gVisor runtime
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    volumes:
      - ./otel-collector-config.yml:/etc/otel-collector-config.yml:ro
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
      - "8888:8888"   # Prometheus metrics
      - "13133:13133" # Health check
    environment:
      - OTEL_LOG_LEVEL=debug
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:13133/"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - clnrm-test-network-gvisor
    depends_on:
      - jaeger
    labels:
      security: high
      isolation: gvisor

  # Jaeger - Distributed tracing UI
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: clnrm-test-jaeger-gvisor
    runtime: runsc  # gVisor runtime
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "16686:16686" # Jaeger UI
      - "14250:14250" # gRPC receiver
      - "14268:14268" # HTTP receiver
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - LOG_LEVEL=debug
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:14269/"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - clnrm-test-network-gvisor
    labels:
      security: high
      isolation: gvisor

  # Prometheus - Metrics storage and querying
  prometheus:
    image: prom/prometheus:latest
    container_name: clnrm-test-prometheus-gvisor
    runtime: runsc  # gVisor runtime
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    volumes:
      - ./prometheus-config.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data-gvisor:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - clnrm-test-network-gvisor
    labels:
      security: high
      isolation: gvisor

  # Alpine - Lightweight container for basic tests
  # Validates basic gVisor functionality
  alpine:
    image: alpine:latest
    container_name: clnrm-test-alpine-gvisor
    command: ["tail", "-f", "/dev/null"]
    runtime: runsc  # gVisor runtime
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    networks:
      - clnrm-test-network-gvisor
    labels:
      security: high
      isolation: gvisor

  # Ubuntu - Full-featured container for complex tests
  ubuntu:
    image: ubuntu:22.04
    container_name: clnrm-test-ubuntu-gvisor
    command: ["tail", "-f", "/dev/null"]
    runtime: runsc  # gVisor runtime
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    networks:
      - clnrm-test-network-gvisor
    labels:
      security: high
      isolation: gvisor

  # Redis - Cache and state management for tests
  redis:
    image: redis:alpine
    container_name: clnrm-test-redis-gvisor
    runtime: runsc  # gVisor runtime
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - clnrm-test-network-gvisor
    labels:
      security: high
      isolation: gvisor

  # PostgreSQL - Alternative database for compatibility tests
  postgres:
    image: postgres:15-alpine
    container_name: clnrm-test-postgres-gvisor
    runtime: runsc  # gVisor runtime
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    environment:
      - POSTGRES_DB=clnrm_test
      - POSTGRES_USER=test_user
      - POSTGRES_PASSWORD=test_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    volumes:
      - postgres-data-gvisor:/var/lib/postgresql/data
    networks:
      - clnrm-test-network-gvisor
    labels:
      security: high
      isolation: gvisor

  # Mock API Server - Simulates external APIs
  mock-api:
    image: mockserver/mockserver:latest
    container_name: clnrm-test-mock-api-gvisor
    runtime: runsc  # gVisor runtime
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "1080:1080"
    environment:
      - MOCKSERVER_LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1080/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - clnrm-test-network-gvisor
    labels:
      security: high
      isolation: gvisor

networks:
  clnrm-test-network-gvisor:
    driver: bridge
    name: clnrm-test-network-gvisor

volumes:
  prometheus-data-gvisor:
    name: clnrm-test-prometheus-data-gvisor
  postgres-data-gvisor:
    name: clnrm-test-postgres-data-gvisor

# TOYOTA PRODUCTION SYSTEM PRINCIPLES APPLIED:
#
# KAIZEN (Continuous Improvement):
# - Add gVisor security audit as pre-flight check
# - Monitor container startup performance in gVisor
# - Track syscall access patterns for each service
#
# JIDOKA (Automation):
# - Auto-detect gVisor installation
# - Auto-verify capabilities before running tests
# - Auto-collect gVisor-specific metrics
#
# JIT (Just-In-Time):
# - Lazy load volumes only when needed
# - Spin up containers on-demand per test
# - Tear down immediately after test completion
#
# GEMBA (Go See):
# - View live container logs with: docker-compose logs -f
# - Inspect running gVisor containers: docker ps --all
# - Check security: docker inspect --format='{{.HostConfig.Runtime}}'

# Usage Guide:
#
# 1. Prerequisites check:
#    docker run --runtime=runsc --rm alpine echo "Hello from gVisor"
#
# 2. Start all gVisor services:
#    docker-compose -f tests/integration/gvisor-compose.test.yml up -d
#
# 3. Run specific tests:
#    docker-compose -f tests/integration/gvisor-compose.test.yml up -d surrealdb
#    cargo test --test database_integration_test
#
# 4. View logs:
#    docker-compose -f tests/integration/gvisor-compose.test.yml logs -f jaeger
#
# 5. Check health:
#    docker-compose -f tests/integration/gvisor-compose.test.yml ps
#
# 6. Cleanup:
#    docker-compose -f tests/integration/gvisor-compose.test.yml down -v
#
# 7. Monitor security:
#    docker inspect clnrm-test-surrealdb-gvisor | grep -A 10 "Runtime"
#
# SECURITY FEATURES:
# - CAP_DROP=ALL: Drops all Linux capabilities (principle of least privilege)
# - CAP_ADD selectively: Only adds NET_BIND_SERVICE for network tests
# - runtime: runsc: Leverages gVisor's user-space kernel
# - Security labels: Track isolation level for compliance
#
# gVisor SECURITY BOUNDARIES VALIDATED:
# ✓ Network isolation: Test services cannot access host network
# ✓ Filesystem isolation: /etc/host, /sys restrictions
# ✓ Syscall interception: Only safe syscalls allowed
# ✓ Process isolation: Cannot see host processes
# ✓ Resource limits: CPU/memory limits enforced
