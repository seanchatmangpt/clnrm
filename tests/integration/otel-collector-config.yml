# OpenTelemetry Collector configuration for clnrm integration testing
# gVisor Migration: Use localhost endpoints for isolated namespace model
#
# This configuration accepts OTLP data and exposes it for validation
# GENCHI GENBUTSU: All endpoints bind to 127.0.0.1 for gVisor compatibility

receivers:
  otlp:
    protocols:
      grpc:
        # gVisor: Bind to localhost only (127.0.0.1:4317)
        endpoint: 127.0.0.1:4317
      http:
        # gVisor: Bind to localhost only (127.0.0.1:4318)
        endpoint: 127.0.0.1:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024

  memory_limiter:
    check_interval: 1s
    limit_mib: 512

exporters:
  # Export to stdout for test verification
  logging:
    verbosity: detailed
    sampling_initial: 5
    sampling_thereafter: 200

  # Export to Jaeger for visualization (optional)
  # gVisor: Use localhost instead of Docker service DNS
  otlp/jaeger:
    endpoint: 127.0.0.1:4317
    tls:
      insecure: true

  # Export metrics to Prometheus (optional)
  # gVisor: Bind to localhost for gVisor safety
  prometheus:
    endpoint: "127.0.0.1:8889"

extensions:
  health_check:
    # gVisor: Bind to localhost only (127.0.0.1:13133)
    endpoint: 127.0.0.1:13133

  pprof:
    # gVisor: Bind to localhost only (127.0.0.1:1777)
    endpoint: 127.0.0.1:1777

  zpages:
    # gVisor: Bind to localhost only (127.0.0.1:55679)
    endpoint: 127.0.0.1:55679

service:
  extensions: [health_check, pprof, zpages]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [logging, otlp/jaeger]

    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [logging, prometheus]

    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [logging]
