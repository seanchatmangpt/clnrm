# Prometheus configuration for OTEL metrics testing
# gVisor Migration: Use localhost instead of Docker service DNS
#
# STANDARDIZATION: All endpoints updated for gVisor isolated namespace model
# - Docker service DNS (otel-collector:8889) replaced with localhost (127.0.0.1:8889)
# - Prometheus self-monitoring uses loopback address

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'otel-collector'
    # gVisor: Use localhost instead of Docker service DNS (otel-collector:8889)
    # Docker Compose override: Set OTEL_COLLECTOR_ENDPOINT env var
    # Default gVisor: 127.0.0.1:8889 (localhost)
    static_configs:
      - targets: ['127.0.0.1:8889']

  - job_name: 'prometheus'
    # Prometheus self-monitoring endpoint
    # gVisor: Use loopback address (127.0.0.1:9090)
    static_configs:
      - targets: ['127.0.0.1:9090']
