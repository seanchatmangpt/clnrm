# Docker Compose for Weaver Live-Check Testing with gVisor Runtime
# Provides OTLP Collector + Weaver validation environment with sandbox isolation
# TOYOTA PRODUCTION SYSTEM: Genchi Genbutsu + Standardization

version: '3.8'

services:
  # OTLP Collector (receives telemetry) [gVisor: runsc]
  otel-collector:
    image: otel/opentelemetry-collector:latest
    runtime: runsc
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"  # OTLP gRPC
      - "4318:4318"  # OTLP HTTP
      - "8888:8888"  # Metrics endpoint
      - "13133:13133" # Health check
    security_opt:
      - apparmor=unconfined
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
    resources:
      limits:
        cpus: '1.0'
        memory: 512M
      reservations:
        cpus: '0.5'
        memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:13133/"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - weaver-test-net

  # Weaver Live-Check (validation service) [gVisor: runsc]
  weaver-validator:
    image: ghcr.io/open-telemetry/weaver:latest
    runtime: runsc
    command: ["registry", "live-check", "--registry", "/registry", "--otlp-http", "http://otel-collector:4318"]
    volumes:
      - ../../registry:/registry:ro
    depends_on:
      - otel-collector
    security_opt:
      - apparmor=unconfined
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - DAC_READ_SEARCH
    resources:
      limits:
        cpus: '1.0'
        memory: 512M
      reservations:
        cpus: '0.5'
        memory: 256M
    networks:
      - weaver-test-net
    ports:
      - "8080:8080"  # HTTP API for stop endpoint

networks:
  weaver-test-net:
    driver: bridge
    name: weaver-test-network

# gVisor STANDARDIZATION COMPLETE
# HEIJUNKA (Load Leveling) Configuration:
#   - otel-collector: 1.0 CPU / 512MB
#   - weaver-validator: 1.0 CPU / 512MB
# Total: 2.0 CPU / 1024MB balanced for validation workloads
#
# All services configured with:
#   - runtime: runsc (gVisor sandbox isolation)
#   - CAP_DROP: ALL + CAP_ADD: minimal (reduced syscall surface)
#   - gVisor-compatible read-only volumes for registry
#   - Service dependencies preserved with health checks
