# OpenTelemetry Collector Configuration for clnrm v1.2.0
# Purpose: Receive OTLP telemetry from clnrm and export to Jaeger for Weaver validation
# Usage: gVisor runtime: runsc --config=/path/to/config.json
# Docker Compose: docker-compose -f docker-compose.weaver.yml up
#
# GENCHI GENBUTSU - gVisor Migration Notes:
# - Endpoints bound to localhost for gVisor isolated namespace model
# - Service discovery via environment variables instead of Docker DNS
# - Health checks use loopback addresses (127.0.0.1)
# - Resource limits optimized for gVisor sandbox overhead

receivers:
  # OTLP receiver for gRPC (port 4317) and HTTP (port 4318)
  # gVisor: Binds to localhost only (127.0.0.1) due to isolated namespace
  otlp:
    protocols:
      grpc:
        # Environment variable: OTEL_OTLP_GRPC_ENDPOINT
        # Format: 127.0.0.1:4317 (localhost) for gVisor
        endpoint: 127.0.0.1:4317
      http:
        # Environment variable: OTEL_OTLP_HTTP_ENDPOINT
        # Format: 127.0.0.1:4318 (localhost) for gVisor
        endpoint: 127.0.0.1:4318
        cors:
          allowed_origins:
            - "*"

processors:
  # Batch processor for efficient export
  batch:
    timeout: 1s
    send_batch_size: 512
    send_batch_max_size: 2048

  # Memory limiter to prevent OOM
  # gVisor: Increased limits due to gVisor sandbox memory overhead (~50-100MB per container)
  # For gVisor: 256 MiB limit + 64 MiB spike allowance
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64

  # Resource processor to ensure service attributes
  resource:
    attributes:
      - key: deployment.environment
        value: testing
        action: upsert
      - key: telemetry.sdk.name
        value: opentelemetry
        action: upsert

  # Attributes processor for data enrichment
  attributes:
    actions:
      - key: collector.name
        value: clnrm-weaver-collector
        action: upsert
      - key: collector.version
        value: 0.112.0
        action: upsert

exporters:
  # Jaeger exporter for trace visualization
  # gVisor: Use localhost instead of Docker service DNS (jaeger:4317)
  # Environment variable: OTEL_JAEGER_ENDPOINT
  # Default: 127.0.0.1:4317 (localhost for gVisor)
  # Docker network: jaeger:4317 (for Docker Compose compatibility)
  otlp/jaeger:
    endpoint: 127.0.0.1:4317
    tls:
      insecure: true

  # Debug exporter for debugging (replaces deprecated logging exporter)
  debug:
    verbosity: detailed
    sampling_initial: 5
    sampling_thereafter: 200

  # File exporter for persistent telemetry (useful for Weaver validation)
  file:
    path: /var/log/otel/traces.json
    rotation:
      max_megabytes: 100
      max_days: 7
      max_backups: 3

service:
  pipelines:
    # Traces pipeline
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, attributes, batch]
      exporters: [otlp/jaeger, debug, file]

    # Metrics pipeline
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, attributes, batch]
      exporters: [debug, file]

    # Logs pipeline
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, attributes, batch]
      exporters: [debug, file]

  # Telemetry configuration for collector itself
  # gVisor: All telemetry endpoints bind to localhost (127.0.0.1) for gVisor safety
  telemetry:
    logs:
      level: info
      development: false
      encoding: json
      output_paths:
        - stdout
      error_output_paths:
        - stderr
    metrics:
      level: detailed
      # gVisor: Bind to localhost only for gVisor isolated namespace
      address: 127.0.0.1:8888

  # Extensions
  extensions: []

# Health check configuration
# gVisor: All extension endpoints bind to localhost (127.0.0.1) for isolated namespace
extensions:
  health_check:
    # Environment variable: OTEL_HEALTH_CHECK_ENDPOINT
    # Default: 127.0.0.1:13133 (localhost for gVisor)
    endpoint: 127.0.0.1:13133
  pprof:
    # Environment variable: OTEL_PPROF_ENDPOINT
    # Default: 127.0.0.1:1777 (localhost for gVisor)
    endpoint: 127.0.0.1:1777
  zpages:
    # Environment variable: OTEL_ZPAGES_ENDPOINT
    # Default: 127.0.0.1:55679 (localhost for gVisor)
    endpoint: 127.0.0.1:55679
