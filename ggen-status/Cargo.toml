[package]
name = "ggen-status"
version = "0.1.0"
edition = "2021"

[lib]
name = "ggen_status"
path = "src/lib.rs"

[[bin]]
name = "ggen-status"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
