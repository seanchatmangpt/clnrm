# Makefile.toml - Cleanroom Testing Framework (80/20 Consolidated)
# Requires: cargo install cargo-make
#
# 80/20 Principle: 30 essential tasks providing 80% of value
# Full task list available in: Makefile.toml.full

# =============================================================================
# CONFIGURATION
# =============================================================================

[config]
skip_core_tasks = true
default_to_workspace = false
init_task = "setup-env"

[env]
RUST_LOG = "info"
RUST_BACKTRACE = "1"
GVISOR_RUNTIME = "runsc"
DOCKER_RUNTIME = "--runtime=runsc"

# =============================================================================
# TIER 1: ESSENTIAL DAILY TASKS (20 tasks - 80% usage)
# =============================================================================

# -----------------------------------------------------------------------------
# Development Workflow (4 tasks)
# -----------------------------------------------------------------------------

[tasks.dev]
description = "⚡ Quick dev iteration: fmt + clippy + test (30s)"
dependencies = ["fmt", "clippy", "test"]

[tasks.quick]
description = "⚡⚡ Ultra-fast check: check + test (10s)"
dependencies = ["check", "test"]

[tasks.fix]
description = "🔧 Auto-fix formatting and clippy issues"
dependencies = ["fmt", "clippy-fix"]

[tasks.watch]
description = "👀 Watch mode: continuous testing"
install_crate = { crate_name = "cargo-watch", binary = "cargo", test_arg = [
    "watch",
    "--help",
] }
command = "cargo"
args = ["watch", "-x", "check", "-x", "test"]

# -----------------------------------------------------------------------------
# Testing (4 tasks)
# -----------------------------------------------------------------------------

[tasks.test]
description = "🧪 Run unit tests (1s timeout)"
command = "timeout"
args = ["1s", "cargo", "test", "--lib"]

[tasks.test-all]
description = "🧪🧪 Run all tests (unit + integration, 1s timeout)"
command = "timeout"
args = ["1s", "cargo", "test", "--all-features"]

[tasks.test-integration]
description = "🧪 Run integration tests only (1s timeout)"
command = "timeout"
args = ["1s", "cargo", "test", "--test", "*"]

[tasks.test-ci]
description = "🚀 CI test runner (1s timeout enforcement)"
command = "bash"
args = ["scripts/test-timeout.sh"]

# -----------------------------------------------------------------------------
# Validation (4 tasks)
# -----------------------------------------------------------------------------

[tasks.validate]
description = "✅ Full production validation"
alias = "validate-production-readiness"

[tasks.validate-crate]
description = "✅ Crate-level validation (Cargo.toml + standards + tests)"
workspace = false
dependencies = ["setup-env"]
script = [
    "echo '🔍 Validating crate: clnrm-core'",
    "cd crates/clnrm-core",
    # Check Cargo.toml
    "echo '📦 Checking Cargo.toml...'",
    "grep -q '^name = ' Cargo.toml && echo '  ✅ name field' || exit 1",
    "grep -q '^version' Cargo.toml && echo '  ✅ version field' || exit 1",
    "grep -q '^edition' Cargo.toml && echo '  ✅ edition field' || exit 1",
    # Check source files
    "echo '📁 Checking source files...'",
    "[ -f src/lib.rs ] && echo '  ✅ src/lib.rs exists' || exit 1",
    # Compilation check
    "echo '🔨 Checking compilation...'",
    "cargo check --quiet && echo '  ✅ Compilation passed' || exit 1",
    # Core team standards
    "echo '🛡️  Checking core team standards...'",
    "unwrap_count=$(grep -r '\\.unwrap()' src/ 2>/dev/null | grep -v test | grep -v '#\\[cfg(test)\\]' | wc -l | tr -d ' ')",
    "expect_count=$(grep -r '\\.expect(' src/ 2>/dev/null | grep -v test | grep -v '#\\[cfg(test)\\]' | wc -l | tr -d ' ')",
    "if [ \"$unwrap_count\" -eq 0 ] && [ \"$expect_count\" -eq 0 ]; then",
    "    echo '  ✅ No .unwrap() or .expect() in production code'",
    "else",
    "    echo \"  ❌ Found $unwrap_count .unwrap() and $expect_count .expect() in production code\"",
    "    exit 1",
    "fi",
    # Tests
    "echo '🧪 Running tests...'",
    "cargo test --lib --quiet && echo '  ✅ Tests passed' || echo '  ⚠️  Some tests failed'",
    # Dependencies
    "echo '📚 Checking dependencies...'",
    "cargo tree --quiet > /dev/null && echo '  ✅ Dependencies validated' || exit 1",
    "cd ../..",
    "echo ''",
    "echo '✅ Crate validation successful: clnrm-core'",
]

[tasks.validate-production-readiness]
description = "🚀 Comprehensive production readiness validation (gVisor)"
workspace = false
dependencies = ["setup-env"]
script = [
    "echo '🚀 Production Readiness Validation (gVisor)'",
    "echo '==========================================='",
    "echo ''",
    # Prerequisites
    "echo '📋 Checking prerequisites (gVisor)...'",
    "if command -v runsc &> /dev/null; then echo '  ✅ gVisor (runsc) available'; else echo '  ⚠️  gVisor not installed'; fi",
    "if command -v docker &> /dev/null; then docker info > /dev/null 2>&1 && echo '  ✅ Docker/containerd running' || echo '  ⚠️  Docker daemon not running'; fi",
    "cargo --version > /dev/null && echo '  ✅ Cargo installed' || exit 1",
    "echo ''",
    # Core team standards
    "echo '🛡️  Checking core team standards...'",
    "unwrap_count=$(grep -r '\\.unwrap()' crates/*/src/ 2>/dev/null | grep -v test | grep -v '#\\[cfg(test)\\]' | wc -l | tr -d ' ')",
    "expect_count=$(grep -r '\\.expect(' crates/*/src/ 2>/dev/null | grep -v test | grep -v '#\\[cfg(test)\\]' | wc -l | tr -d ' ')",
    "if [ \"$unwrap_count\" -eq 0 ] && [ \"$expect_count\" -eq 0 ]; then",
    "    echo '  ✅ No .unwrap() or .expect() in production code'",
    "else",
    "    echo \"  ⚠️  Found $unwrap_count .unwrap() and $expect_count .expect()\"",
    "fi",
    "echo ''",
    # Tests
    "echo '🧪 Running test suite...'",
    "cargo test --all-features --quiet && echo '  ✅ All tests passed' || (echo '  ❌ Tests failed' && exit 1)",
    "echo ''",
    # Linting
    "echo '🔍 Running clippy...'",
    "cargo clippy --all-features -- -D warnings && echo '  ✅ Clippy passed' || (echo '  ❌ Clippy failed' && exit 1)",
    "echo ''",
    # Build
    "echo '🔨 Building release...'",
    "cargo build --release --quiet && echo '  ✅ Release build successful' || (echo '  ❌ Build failed' && exit 1)",
    "echo ''",
    "echo '✅ Production readiness validation PASSED (gVisor-compatible)'",
]

[tasks.clippy]
description = "🔍 Run clippy linter (zero warnings)"
command = "cargo"
args = ["clippy", "--all-features", "--", "-D", "warnings"]

# -----------------------------------------------------------------------------
# Formatting (2 tasks)
# -----------------------------------------------------------------------------

[tasks.fmt]
description = "📝 Format all code"
command = "cargo"
args = ["fmt", "--all"]

[tasks.fmt-check]
description = "📝 Check code formatting"
command = "cargo"
args = ["fmt", "--all", "--", "--check"]

# -----------------------------------------------------------------------------
# Build (3 tasks)
# -----------------------------------------------------------------------------

[tasks.build]
description = "🔨 Build all workspace crates (debug)"
command = "cargo"
args = ["build"]

[tasks.build-release]
description = "🔨 Build all workspace crates (release)"
command = "cargo"
args = ["build", "--release", "--all-features"]

[tasks.check]
description = "⚡ Quick check without building"
command = "cargo"
args = ["check", "--all-features"]

# -----------------------------------------------------------------------------
# CI & Production (2 tasks)
# -----------------------------------------------------------------------------

[tasks.ci]
description = "🤖 Complete CI pipeline"
dependencies = ["fmt-check", "clippy", "test-all", "build"]

[tasks.production-ready]
description = "🚀 Complete production readiness (CI + validation + release)"
dependencies = [
    "fmt-check",
    "clippy",
    "test-all",
    "validate-crate",
    "validate-production-readiness",
    "build-release",
]

# -----------------------------------------------------------------------------
# Documentation (2 tasks)
# -----------------------------------------------------------------------------

[tasks.doc]
description = "📚 Generate documentation"
command = "cargo"
args = ["doc", "--no-deps", "--all-features"]

[tasks.doc-open]
description = "📚 Generate and open documentation"
command = "cargo"
args = ["doc", "--no-deps", "--all-features", "--open"]

# -----------------------------------------------------------------------------
# Utilities (2 tasks)
# -----------------------------------------------------------------------------

[tasks.clean]
description = "🧹 Clean build artifacts"
command = "cargo"
args = ["clean"]

[tasks.setup-env]
description = "🔧 Setup development environment (gVisor)"
script = [
    "echo '🔧 Setting up clnrm development environment (gVisor)...'",
    "echo ''",
    "echo '📋 Checking prerequisites:'",
    "cargo --version",
    "echo 'Checking for gVisor...'",
    "if command -v runsc &> /dev/null; then echo '✅ gVisor (runsc) found'; else echo '⚠️  gVisor not installed'; fi",
    "echo 'Checking for Docker/Container runtime...'",
    "if command -v docker &> /dev/null; then docker --version; else echo '⚠️  Docker not installed'; fi",
    "echo '✅ Prerequisites check passed'",
    "echo ''",
    "echo '🔍 Checking cargo-make installation:'",
    "cargo make --version",
    "echo '✅ Environment setup complete (gVisor migration ready)'",
]

# =============================================================================
# TIER 2: SPECIALIZED TASKS (10 tasks - 20% usage)
# =============================================================================

[tasks.benchmarks]
description = "📊 Run performance benchmarks"
command = "cargo"
args = ["bench", "--features", "proptest"]

[tasks.publish-check]
description = "📦 Dry-run publish check"
command = "cargo"
args = ["publish", "--dry-run", "-p", "clnrm-core"]

[tasks.publish]
description = "📦 Publish to crates.io"
command = "cargo"
args = ["publish", "-p", "clnrm-core"]

[tasks.audit]
description = "🔒 Security audit"
install_crate = { crate_name = "cargo-audit", binary = "cargo", test_arg = [
    "audit",
    "--help",
] }
command = "cargo"
args = ["audit"]

[tasks.outdated]
description = "📦 Check for outdated dependencies"
install_crate = { crate_name = "cargo-outdated", binary = "cargo", test_arg = [
    "outdated",
    "--help",
] }
command = "cargo"
args = ["outdated"]

[tasks.build-otel]
description = "🔨 Build with OpenTelemetry features"
command = "cargo"
args = ["build", "--release"]

[tasks.test-otel]
description = "🧪 Test OpenTelemetry features"
command = "cargo"
args = ["test"]

[tasks.cleanroom-validate]
description = "✅ Validate cleanroom test framework"
command = "cargo"
args = ["test", "--test", "*", "--", "--test-threads=1"]

[tasks.pre-commit]
description = "✅ Pre-commit validation (fmt + clippy + test)"
dependencies = ["fmt", "clippy", "test", "validate-crate"]

[tasks.clippy-fix]
description = "🔧 Auto-fix clippy warnings"
command = "cargo"
args = ["clippy", "--fix", "--allow-dirty", "--allow-staged"]

# =============================================================================
# gVisor TEST SUITE (Agent 8 - Comprehensive Test Migration)
# =============================================================================
# Toyota Principles: GENCHI GENBUTSU, HEIJUNKA, STANDARDIZATION, KAIZEN

[tasks.test-unit-gvisor]
description = "🧪 gVisor Unit Tests (native, no Docker)"
script = [
    "bash scripts/run_unit_tests_gvisor.sh --verbose"
]

[tasks.test-integration-gvisor]
description = "🧪 gVisor Integration Tests (with sandboxed services)"
script = [
    "bash scripts/run_integration_tests_gvisor.sh"
]

[tasks.test-otel-gvisor]
description = "🧪 gVisor OTEL Validation (telemetry in sandbox)"
script = [
    "bash scripts/run_integration_tests_gvisor.sh --otel-only"
]

[tasks.test-all-gvisor]
description = "🧪🧪🧪 gVisor Complete Test Suite (unit + integration + OTEL)"
script = [
    "bash scripts/run_all_tests_gvisor.sh"
]

[tasks.test-gvisor-quick]
description = "⚡ gVisor Quick Tests (fast subset)"
script = [
    "bash scripts/run_all_tests_gvisor.sh --quick"
]

[tasks.validate-gvisor-infrastructure]
description = "✅ Validate gVisor infrastructure setup"
script = [
    "echo '🔍 Checking gVisor Installation'",
    "docker run --runtime=runsc --rm alpine echo 'gVisor available' || (echo 'gVisor not available' && exit 1)",
    "echo '✅ gVisor runtime verified'",
    "echo ''",
    "echo '🔍 Checking Compose Files'",
    "test -f tests/integration/gvisor-compose.test.yml && echo '✅ gvisor-compose.test.yml found' || exit 1",
    "test -f tests/integration/gvisor-compose.otel-test.yml && echo '✅ gvisor-compose.otel-test.yml found' || exit 1",
    "test -f gvisor-compose.weaver.yml && echo '✅ gvisor-compose.weaver.yml found' || exit 1",
    "echo ''",
    "echo '🔍 Checking Test Runners'",
    "test -x scripts/run_unit_tests_gvisor.sh && echo '✅ run_unit_tests_gvisor.sh ready' || exit 1",
    "test -x scripts/run_integration_tests_gvisor.sh && echo '✅ run_integration_tests_gvisor.sh ready' || exit 1",
    "test -x scripts/run_all_tests_gvisor.sh && echo '✅ run_all_tests_gvisor.sh ready' || exit 1",
    "echo ''",
    "echo '✅ gVisor Test Infrastructure Ready'",
]

[tasks.gvisor-start-services]
description = "🚀 Start gVisor test services (integration)"
script = [
    "echo '🚀 Starting gVisor test services...'",
    "docker-compose -f tests/integration/gvisor-compose.test.yml up -d",
    "echo '⏳ Waiting for services to be healthy (30s timeout)...'",
    "bash -c 'for i in {1..30}; do docker-compose -f tests/integration/gvisor-compose.test.yml ps | grep -q unhealthy || break; sleep 1; done'",
    "echo '✅ Services started'",
    "docker-compose -f tests/integration/gvisor-compose.test.yml ps",
]

[tasks.gvisor-start-otel]
description = "🚀 Start gVisor OTEL services"
script = [
    "echo '🚀 Starting gVisor OTEL services...'",
    "docker-compose -f tests/integration/gvisor-compose.otel-test.yml up -d",
    "echo '⏳ Waiting for services to be healthy...'",
    "sleep 10",
    "echo '✅ OTEL services started'",
    "docker-compose -f tests/integration/gvisor-compose.otel-test.yml ps",
]

[tasks.gvisor-start-weaver]
description = "🚀 Start gVisor Weaver validation services"
script = [
    "echo '🚀 Starting gVisor Weaver services...'",
    "docker-compose -f gvisor-compose.weaver.yml up -d",
    "echo '⏳ Waiting for services to be healthy...'",
    "sleep 10",
    "echo '✅ Weaver services started'",
    "docker-compose -f gvisor-compose.weaver.yml ps",
]

[tasks.gvisor-stop-all]
description = "🛑 Stop all gVisor test services"
script = [
    "echo '🛑 Stopping all gVisor services...'",
    "docker-compose -f tests/integration/gvisor-compose.test.yml down -v 2>/dev/null || true",
    "docker-compose -f tests/integration/gvisor-compose.otel-test.yml down -v 2>/dev/null || true",
    "docker-compose -f gvisor-compose.weaver.yml down -v 2>/dev/null || true",
    "echo '✅ All services stopped'",
]

[tasks.gvisor-logs]
description = "📋 Show gVisor service logs"
script = [
    "docker-compose -f tests/integration/gvisor-compose.test.yml logs -f --tail=50"
]

[tasks.gvisor-health-check]
description = "🏥 Check health of all gVisor services"
script = [
    "echo '🏥 gVisor Services Health Check'",
    "echo '=============================='",
    "echo ''",
    "echo '1. Test Services:'",
    "docker-compose -f tests/integration/gvisor-compose.test.yml ps",
    "echo ''",
    "echo '2. OTEL Services:'",
    "docker-compose -f tests/integration/gvisor-compose.otel-test.yml ps 2>/dev/null || echo 'Not running'",
    "echo ''",
    "echo '3. Weaver Services:'",
    "docker-compose -f gvisor-compose.weaver.yml ps 2>/dev/null || echo 'Not running'",
    "echo ''",
    "echo 'Endpoint Health Checks:'",
    "echo '  OTEL Collector: curl http://localhost:13133/ || echo (not running)'",
    "echo '  Jaeger UI: http://localhost:16686/'",
    "echo '  Prometheus: http://localhost:9090/'",
    "echo '  SurrealDB: http://localhost:8000/'",
]

# =============================================================================
# ALIASES FOR BACKWARD COMPATIBILITY
# =============================================================================

[tasks.all]
description = "🎯 Complete workflow: format + lint + test + build"
alias = "production-ready"

[tasks.validate-all]
alias = "production-ready"

[tasks.full-check]
alias = "ci"

[tasks.quick-test]
alias = "test-quick"

# =============================================================================
# HELP & DISCOVERY
# =============================================================================

