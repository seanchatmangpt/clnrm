[package]
name = "clnrm-cli"
version = "26.5.28"
edition = "2021"
authors = ["Cleanroom Core Team"]
description = "Cleanroom CLI - Noun-Verb interface for hermetic testing"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
linkme = "0.3"
clnrm-core = { path = "../clnrm-core", version = "26.5.28" }
clap-noun-verb = { version = "5.6.2", features = ["async"] }
clap-noun-verb-macros = "5.6.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1.0"
anyhow = "1.0"
tokio = { version = "1.0", features = ["full"] }
walkdir = "2.3"
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

[[bin]]
name = "clnrm"
path = "src/main.rs"
