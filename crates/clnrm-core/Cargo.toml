[features]
default = ["backend-gvisor"]
ai = [
] # Marker feature for AI functionality (no dependencies to avoid circular deps)

# Backend selection features (mutually exclusive by convention)
backend-gvisor = [] # Default: gVisor-native container runtime (no Docker required)
backend-docker = [] # Future: Docker API backend
backend-testcontainers = [] # Testcontainers backend support
backend-auto = [] # Auto-detect available backend

otel = ["otel-traces", "otel-metrics", "otel-logs"] # Umbrella feature for all OTEL functionality
otel-testing = ["opentelemetry_sdk/testing"]
otel-traces = [] # Feature for OpenTelemetry traces functionality
otel-metrics = [] # Feature for OpenTelemetry metrics functionality
otel-logs = [] # Feature for OpenTelemetry logs functionality
docker-integration = [] # Enable integration tests that require Docker daemon (CI/CD feature)
full-integration = ["docker-integration"] # Full integration test suite (requires Docker + external services)
crypto = ["dep:ed25519-dalek"] # Cryptographic receipt signatures (Ed25519)

# Test timeout enforcement
[package.metadata.cargo-make]
test_timeout = 1
