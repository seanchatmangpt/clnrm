[package]
name = "clnrm-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Cleanroom Testing Framework - Core library"
keywords = ["testing", "integration", "containers", "hermetic", "ai"]
categories = ["development-tools"]

[[bin]]
name = "run_stress_test"
path = "src/bin/run_stress_test.rs"

[lib]
name = "clnrm_core"
path = "src/lib.rs"
test = false

[dependencies]
# Core dependencies
tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
async-trait = "0.1"

# Container dependencies
futures-util = { workspace = true }
surrealdb = { workspace = true }
petgraph = "0.6"

# CLI dependencies
clap = { workspace = true }
clap-noun-verb = { version = "5.3.2", features = ["async"] }
clap-noun-verb-macros = "5.3.2"
linkme = "0.3"  # Required for clap-noun-verb macro auto-discovery
env_logger = { workspace = true }
log = { workspace = true }
toml = { workspace = true }
regex = { workspace = true }
walkdir = { workspace = true }
tempfile = { workspace = true }
junit-report = { workspace = true }
notify = { workspace = true }
toml_edit = { workspace = true }
quick-xml = { workspace = true }

# OpenTelemetry dependencies
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-stdout = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry-jaeger = { workspace = true }
opentelemetry-zipkin = { workspace = true }
opentelemetry-semantic-conventions = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true }

# Additional dependencies for OTLP integration
reqwest = { workspace = true }

# Utility dependencies
uuid = { workspace = true }
chrono = { workspace = true }
hostname = { workspace = true }
once_cell = { workspace = true }
dashmap = { workspace = true }
rand = "0.8"
semver = "1.0"
glob = "0.3"
url = "2.5"
which = "6.0"
colored = "2.1"  # For beautiful terminal output in diagnostic formatter
crossbeam = "0.8"  # Lock-free concurrent data structures (SegQueue)
socket2 = "0.5"
num_cpus = "1.16"  # For CPU core detection

# Unix signal handling and file locking for Weaver controller and port allocator
[target.'cfg(unix)'.dependencies]
nix = { version = "0.27", features = ["signal", "fs"] }

# Template rendering - Full-featured template engine for test configuration
clnrm-template = "1.3"  # Use published version until clnrm-template reaches v1.7.0
sha2 = "0.10"                                   # For content hashing in Σ* system
hex = "0.4"                                     # For hex encoding content hashes
ed25519-dalek = { version = "2.1", optional = true }  # For receipt signature verification

# OCI and gVisor support
flate2 = "1.0"     # For gzip decompression of OCI layers
tar = "0.4"        # For extracting tar archives
dirs = "5.0"       # For accessing standard directories

[dev-dependencies]
# Property-based testing
proptest = "1.4"

# Benchmarking
criterion = { workspace = true }
tempfile = { workspace = true }

# Async testing
tokio = { workspace = true }

# Test isolation (for tests with global state)
serial_test = "3.2"

# Integration testing dependencies
futures-util = { workspace = true }

# Chicago TDD mocking
mockall = { workspace = true }

# Chicago TDD testing framework
chicago-tdd-tools = "1.4.0"
fake = "5.1.0"

[[bench]]
name = "hot_reload_critical_path"
harness = false
path = "../../benches/hot_reload_critical_path.rs"

[[bench]]
name = "stress_capacity_benchmarks"
harness = false
path = "../../benches/stress_capacity_benchmarks.rs"

[[bench]]
name = "v1_4_0_performance_validation"
harness = false
path = "../../benches/v1_4_0_performance_validation.rs"

[[example]]
name = "status-validator-demo"
path = "examples/validation/status_validator_demo.rs"

[[example]]
name = "complete-dogfooding-suite"
path = "examples/framework-self-testing/complete-dogfooding-suite.rs"

[[example]]
name = "observability-demo"
path = "examples/observability/observability-demo.rs"

[[example]]
name = "custom-plugin-demo"
path = "examples/plugins/custom-plugin-demo.rs"

[[example]]
name = "container-reuse-benchmark"
path = "examples/performance/container-reuse-benchmark.rs"

[[example]]
name = "container-lifecycle-test"
path = "examples/framework-self-testing/container-lifecycle-test.rs"

[[example]]
name = "config-loading-test"
path = "examples/config/config-loading-test.rs"

[[example]]
name = "surrealdb-ollama-integration"
path = "examples/surrealdb-ollama-integration.rs"

