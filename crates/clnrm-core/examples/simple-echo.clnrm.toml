[test]
name = "framework_toml_self_test"
description = "Test that framework's TOML configuration delivers promised features"
timeout = "120s"

[containers.framework_test]
image = "alpine:latest"

[[steps]]
name = "validate_echo_functionality"
container = "framework_test"
exec = ["echo", "Framework TOML configuration working"]
assert.stdout_contains = "Framework TOML configuration working"
assert.exit_code = 0