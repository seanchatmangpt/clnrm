[package]
name = "clnrm-migrate"
version = "0.1.0"
edition = "2021"
description = "Migration tool for converting testcontainers configs to gVisor"
authors = ["CLNRM Contributors"]

[dependencies]
clnrm-core = { path = "../clnrm-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "1.0"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
glob = "0.3"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1.0", features = ["v4"] }

# For Rust source parsing
syn = { version = "2.0", features = ["full", "parsing"] }
quote = "1.0"

[dev-dependencies]
tempfile = "3.0"

[[bin]]
name = "clnrm-migrate"
path = "src/main.rs"
