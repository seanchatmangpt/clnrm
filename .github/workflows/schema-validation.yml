name: Schema Validation

on:
  push:
    paths:
      - 'registry/**'
      - 'tools/schema-validator/**'
  pull_request:
    paths:
      - 'registry/**'
      - 'tools/schema-validator/**'

jobs:
  validate-schemas:
    name: Validate Telemetry Schemas
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for breaking change detection

      - name: Install Weaver
        run: |
          cargo install weaver-cli --locked
          weaver --version

      - name: Run Schema Syntax Validation
        run: |
          echo "::group::Schema Syntax Check"
          weaver registry check -r registry/ --verbose
          echo "::endgroup::"

      - name: Run Completeness Check
        run: |
          echo "::group::Schema Completeness Check"
          ./tools/schema-validator/validate_schemas.sh
          echo "::endgroup::"

      - name: Check Breaking Changes (PR only)
        if: github.event_name == 'pull_request'
        run: |
          echo "::group::Breaking Change Detection"

          # Get base branch schemas
          git checkout ${{ github.event.pull_request.base.sha }}
          mkdir -p /tmp/old-schemas
          cp -r registry /tmp/old-schemas/

          # Get current branch schemas
          git checkout ${{ github.event.pull_request.head.sha }}

          # Compare schemas
          echo "Comparing schemas between base and head..."

          # Simple file-based comparison
          BREAKING_CHANGES=0

          for schema in registry/core/*.yaml registry/metrics/*.yaml registry/events/*.yaml; do
            schema_name=$(basename "$schema")
            old_schema="/tmp/old-schemas/registry/${schema#registry/}"

            if [ -f "$old_schema" ]; then
              echo "Checking $schema_name for changes..."

              # Check for removed required attributes
              OLD_REQUIRED=$(grep -A 1 "requirement_level: required" "$old_schema" | grep "id:" | awk '{print $2}' | sort || true)
              NEW_REQUIRED=$(grep -A 1 "requirement_level: required" "$schema" | grep "id:" | awk '{print $2}' | sort || true)

              REMOVED=$(comm -23 <(echo "$OLD_REQUIRED") <(echo "$NEW_REQUIRED"))

              if [ -n "$REMOVED" ]; then
                echo "::error::Breaking change in $schema_name - removed required attributes: $REMOVED"
                BREAKING_CHANGES=1
              fi

              # Check for removed schemas
            elif [ ! -f "$old_schema" ]; then
              echo "::warning::New schema added: $schema_name"
            fi
          done

          # Check for removed schemas
          for old_schema in /tmp/old-schemas/registry/core/*.yaml /tmp/old-schemas/registry/metrics/*.yaml /tmp/old-schemas/registry/events/*.yaml; do
            schema_name=$(basename "$old_schema")
            new_schema="registry/${old_schema#/tmp/old-schemas/registry/}"

            if [ ! -f "$new_schema" ]; then
              echo "::error::Breaking change - removed schema: $schema_name"
              BREAKING_CHANGES=1
            fi
          done

          if [ "$BREAKING_CHANGES" -eq 1 ]; then
            echo "::error::Breaking changes detected! Update CHANGELOG and provide migration guide."
            exit 1
          else
            echo "No breaking changes detected"
          fi

          echo "::endgroup::"

      - name: Generate Validation Report
        if: always()
        run: |
          echo "::group::Validation Report"
          echo "## Schema Validation Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Count schemas
          SPAN_COUNT=$(find registry/core -name "*.yaml" -exec grep -l "type: span" {} \; | wc -l)
          METRIC_COUNT=$(find registry/metrics -name "*.yaml" -exec grep -l "type: metric" {} \; | wc -l)
          EVENT_COUNT=$(find registry/events -name "*.yaml" -exec grep -l "type: event" {} \; | wc -l)
          TOTAL=$((SPAN_COUNT + METRIC_COUNT + EVENT_COUNT))

          echo "### Schema Statistics" >> $GITHUB_STEP_SUMMARY
          echo "- Total Schemas: $TOTAL" >> $GITHUB_STEP_SUMMARY
          echo "- Spans: $SPAN_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "- Metrics: $METRIC_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "- Events: $EVENT_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # List critical schemas
          echo "### Critical Schemas" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          grep -h "id: span.clnrm" registry/core/*.yaml | sed 's/- id: /- /' >> $GITHUB_STEP_SUMMARY || true
          echo "" >> $GITHUB_STEP_SUMMARY

          # Validation status
          if [ "${{ job.status }}" == "success" ]; then
            echo "### ✅ Validation Status: PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Validation Status: FAILED" >> $GITHUB_STEP_SUMMARY
          fi

          echo "::endgroup::"

      - name: Upload Validation Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-validation-results
          path: |
            registry/
            tools/schema-validator/
          retention-days: 30

  lint-schemas:
    name: Lint Schema Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check YAML formatting
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: registry/
          config_data: |
            extends: default
            rules:
              line-length:
                max: 120
                level: warning
              indentation:
                spaces: 2
              comments:
                min-spaces-from-content: 1

      - name: Validate YAML structure
        run: |
          echo "Checking YAML structure..."

          for file in registry/**/*.yaml; do
            echo "Checking $file..."

            # Check for required top-level keys in schema files
            if [[ "$file" == registry/core/* ]] || [[ "$file" == registry/metrics/* ]] || [[ "$file" == registry/events/* ]]; then
              if ! grep -q "^groups:" "$file"; then
                echo "::error::Missing 'groups' key in $file"
                exit 1
              fi
            fi

            # Check for required fields in group definitions
            if grep -q "type: span" "$file"; then
              if ! grep -q "span_kind:" "$file"; then
                echo "::warning::Missing 'span_kind' in span definition in $file"
              fi
            fi

            # Check stability is set
            if ! grep -q "stability:" "$file"; then
              echo "::warning::Missing 'stability' in $file"
            fi
          done

          echo "YAML structure validation complete"
