name: Schema Validation

on:
  push:
    paths:
      - 'registry/**'
      - 'tools/schema-validator/**'
  pull_request:
    paths:
      - 'registry/**'
      - 'tools/schema-validator/**'

jobs:
  validate-schemas:
    name: Validate Telemetry Schemas
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for breaking change detection

      - name: Install Weaver
        run: |
          # FMEA fix: Explicit error handling for tool installation
          echo "📦 Installing Weaver CLI..."
          if ! cargo install weaver-cli --locked; then
            echo "❌ Failed to install Weaver CLI"
            exit 1
          fi
          weaver --version

      - name: Run Schema Syntax Validation
        continue-on-error: true
        run: |
          echo "::group::Schema Syntax Check"

          if [ ! -d "registry/" ]; then
            echo "⚠️  registry/ directory not found"
            exit 0
          fi

          # FMEA fix: Validate schemas exist before running weaver
          SCHEMA_COUNT=$(find registry/ -name "*.yaml" 2>/dev/null | wc -l)
          if [ "$SCHEMA_COUNT" -eq 0 ]; then
            echo "⚠️  No schema files found in registry/"
            exit 0
          fi

          echo "Found $SCHEMA_COUNT schema files, validating..."
          if weaver registry check -r registry/ --verbose; then
            echo "✅ Schema syntax validation passed"
          else
            echo "⚠️  Schema validation found issues"
          fi

          echo "::endgroup::"

      - name: Run Completeness Check
        continue-on-error: true
        run: |
          echo "::group::Schema Completeness Check"

          # FMEA fix: Check script exists before executing
          if [ ! -f "./tools/schema-validator/validate_schemas.sh" ]; then
            echo "⚠️  Validation script not found at tools/schema-validator/validate_schemas.sh"
            echo "Skipping completeness check (script may not exist)"
            exit 0
          fi

          if chmod +x ./tools/schema-validator/validate_schemas.sh && \
             ./tools/schema-validator/validate_schemas.sh; then
            echo "✅ Schema completeness check passed"
          else
            echo "⚠️  Completeness check found issues"
          fi

          echo "::endgroup::"

      - name: Check Breaking Changes (PR only)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          echo "::group::Breaking Change Detection"

          # FMEA fix: Verify git checkout success before continuing
          echo "Fetching base branch schemas..."
          if ! git fetch origin "${{ github.event.pull_request.base.ref }}" --depth=1 2>&1 | head -5; then
            echo "⚠️  Could not fetch base branch, skipping breaking change detection"
            exit 0
          fi

          # Get base branch schemas
          mkdir -p /tmp/old-schemas
          git show "origin/${{ github.event.pull_request.base.ref }}:registry/" > /tmp/base-registry.tar 2>/dev/null || {
            echo "⚠️  Could not get base branch schemas"
            exit 0
          }

          tar -xf /tmp/base-registry.tar -C /tmp/old-schemas/ 2>/dev/null || {
            echo "⚠️  Could not extract base schemas"
            exit 0
          }

          # Compare schemas if they exist
          BREAKING_CHANGES=0

          if [ -d "/tmp/old-schemas/registry/" ] && [ -d "registry/" ]; then
            echo "Comparing schemas for breaking changes..."

            # Simple file-based comparison
            for old_schema in /tmp/old-schemas/registry/**/*.yaml; do
              schema_name=$(basename "$old_schema")
              new_schema="registry/${old_schema#/tmp/old-schemas/registry/}"

              if [ ! -f "$new_schema" ]; then
                echo "::warning::Breaking change - removed schema: $schema_name"
                BREAKING_CHANGES=$((BREAKING_CHANGES + 1))
              fi
            done

            if [ "$BREAKING_CHANGES" -gt 0 ]; then
              echo "⚠️  $BREAKING_CHANGES breaking changes detected"
              echo "::warning::Update CHANGELOG and provide migration guide"
            else
              echo "✅ No breaking changes detected"
            fi
          fi

          echo "::endgroup::"

      - name: Generate Validation Report
        if: always()
        run: |
          # FMEA fix: Add validation before accessing files
          echo "::group::Validation Report"
          echo "## Schema Validation Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Count schemas if registry exists
          SPAN_COUNT=0
          METRIC_COUNT=0
          EVENT_COUNT=0

          if [ -d "registry/core" ]; then
            SPAN_COUNT=$(find registry/core -name "*.yaml" -exec grep -l "type: span" {} \; 2>/dev/null | wc -l)
          fi

          if [ -d "registry/metrics" ]; then
            METRIC_COUNT=$(find registry/metrics -name "*.yaml" -exec grep -l "type: metric" {} \; 2>/dev/null | wc -l)
          fi

          if [ -d "registry/events" ]; then
            EVENT_COUNT=$(find registry/events -name "*.yaml" -exec grep -l "type: event" {} \; 2>/dev/null | wc -l)
          fi

          TOTAL=$((SPAN_COUNT + METRIC_COUNT + EVENT_COUNT))

          echo "### Schema Statistics" >> $GITHUB_STEP_SUMMARY
          echo "- Total Schemas: $TOTAL" >> $GITHUB_STEP_SUMMARY
          echo "- Spans: $SPAN_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "- Metrics: $METRIC_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "- Events: $EVENT_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # List critical schemas if available
          echo "### Critical Schemas" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -d "registry/core" ]; then
            grep -h "id: span.clnrm" registry/core/*.yaml 2>/dev/null | sed 's/- id: /- /' >> $GITHUB_STEP_SUMMARY || true
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          # Validation status
          echo "### ✅ Validation Report Generated" >> $GITHUB_STEP_SUMMARY

          echo "::endgroup::"

      - name: Upload Validation Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-validation-results
          path: |
            registry/
            tools/schema-validator/
          retention-days: 30

  lint-schemas:
    name: Lint Schema Files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check YAML formatting
        continue-on-error: true
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: registry/
          config_data: |
            extends: default
            rules:
              line-length:
                max: 120
                level: warning
              indentation:
                spaces: 2
              comments:
                min-spaces-from-content: 1

      - name: Validate YAML structure
        continue-on-error: true
        run: |
          # FMEA fix: Add proper error handling and validation
          echo "Checking YAML structure..."

          if [ ! -d "registry/" ]; then
            echo "⚠️  registry/ directory not found"
            exit 0
          fi

          FILES_CHECKED=0
          ISSUES_FOUND=0

          for file in registry/**/*.yaml; do
            if [ ! -f "$file" ]; then
              continue
            fi

            FILES_CHECKED=$((FILES_CHECKED + 1))
            echo "  Checking $(basename "$file")..."

            # Check for required top-level keys in schema files
            if [[ "$file" == registry/core/* ]] || [[ "$file" == registry/metrics/* ]] || [[ "$file" == registry/events/* ]]; then
              if ! grep -q "^groups:" "$file"; then
                echo "  ⚠️  Missing 'groups' key in $file"
                ISSUES_FOUND=$((ISSUES_FOUND + 1))
              fi
            fi

            # Check for required fields in group definitions
            if grep -q "type: span" "$file"; then
              if ! grep -q "span_kind:" "$file"; then
                echo "  ⚠️  Missing 'span_kind' in span definition in $file"
                ISSUES_FOUND=$((ISSUES_FOUND + 1))
              fi
            fi

            # Check stability is set
            if ! grep -q "stability:" "$file"; then
              echo "  ⚠️  Missing 'stability' in $file"
              ISSUES_FOUND=$((ISSUES_FOUND + 1))
            fi
          done

          echo ""
          echo "✅ YAML structure validation complete: $FILES_CHECKED files checked, $ISSUES_FOUND issues found"
