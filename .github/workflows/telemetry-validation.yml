name: Telemetry Validation

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

env:
  WEAVER_VERSION: "0.16.1"  # Centralized in .tool-versions
  OTLP_PORT: 4317
  VALIDATION_TIMEOUT: 120  # Reduced for faster feedback
  RUST_LOG: debug

jobs:
  validate-telemetry:
    name: Validate OpenTelemetry Schemas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust with cache
        uses: ./.github/actions/setup-rust-cache
        with:
          components: clippy, rustfmt
          cache-key-prefix: telemetry-validation

      - name: Install Dependencies
        timeout-minutes: 10
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq netcat-traditional
          echo "✅ Dependencies installed"

      - name: Clean up port 4317
        continue-on-error: true
        run: |
          # Use portable POSIX approach for port cleanup
          PORT=${{ env.OTLP_PORT }}
          echo "🧹 Cleaning up port $PORT..."

          # Try netstat first (portable)
          if command -v netstat &> /dev/null; then
            PIDS=$(netstat -tulnp 2>/dev/null | grep ":$PORT " | awk '{print $NF}' | cut -d'/' -f1)
          # Fall back to ss (modern Linux)
          elif command -v ss &> /dev/null; then
            PIDS=$(ss -tulnp 2>/dev/null | grep ":$PORT " | awk '{print $NF}' | cut -d':' -f1 | grep -oE '[0-9]+')
          fi

          if [ -n "$PIDS" ]; then
            echo "Found processes on port $PORT: $PIDS"
            for PID in $PIDS; do
              if [ -n "$PID" ] && [ "$PID" != "-" ]; then
                kill -15 "$PID" 2>/dev/null || true
                sleep 1
              fi
            done
          fi
          echo "✅ Port cleanup completed"

      - name: Install Weaver CLI
        id: weaver
        continue-on-error: true
        timeout-minutes: 15
        run: |
          cargo install weaver-cli --locked 2>/dev/null || cargo install weaver-forge --locked 2>/dev/null
          command -v weaver && weaver --version

      - name: Create Output Directory
        run: |
          mkdir -p validation_output
          echo "✅ Output directory created"

      - name: Verify port availability
        run: |
          for i in {1..3}; do
            if ! netcat -z localhost ${{ env.OTLP_PORT }} >/dev/null 2>&1; then
              echo "✅ Port ${{ env.OTLP_PORT }} is available"
              exit 0
            fi
            echo "⚠️  Attempt $i: Port ${{ env.OTLP_PORT }} still in use, retrying..."
            sleep 2
          done
          echo "❌ Port ${{ env.OTLP_PORT }} failed to become available"
          exit 1

      - name: Start Weaver Live-Check
        id: weaver-start
        if: steps.weaver.outcome == 'success'
        timeout-minutes: 5
        run: |
          echo "🔍 Starting Weaver live-check on port ${{ env.OTLP_PORT }}..."

          weaver registry live-check \
            --registry registry/ \
            --otlp-grpc-port ${{ env.OTLP_PORT }} \
            --format json \
            --output validation_output/ \
            --inactivity-timeout ${{ env.VALIDATION_TIMEOUT }} \
            2>&1 | tee validation_output/weaver.log &

          WEAVER_PID=$!
          echo "process-id=${WEAVER_PID}" >> $GITHUB_OUTPUT
          echo $WEAVER_PID > weaver.pid
          echo "Weaver PID: $WEAVER_PID"

          # Wait for process to be ready
          WAIT_ATTEMPTS=0
          MAX_ATTEMPTS=15
          while [ $WAIT_ATTEMPTS -lt $MAX_ATTEMPTS ]; do
            if kill -0 $WEAVER_PID 2>/dev/null; then
              if netcat -z localhost ${{ env.OTLP_PORT }} 2>/dev/null; then
                echo "✅ Weaver live-check started successfully"
                exit 0
              fi
            else
              echo "❌ Weaver process died"
              cat validation_output/weaver.log
              exit 1
            fi
            WAIT_ATTEMPTS=$((WAIT_ATTEMPTS + 1))
            echo "⏳ Waiting for Weaver (attempt $WAIT_ATTEMPTS/$MAX_ATTEMPTS)..."
            sleep 2
          done

          echo "❌ Weaver failed to start within timeout"
          if [ -f validation_output/weaver.log ]; then
            echo "Weaver log:"
            cat validation_output/weaver.log
          fi
          kill -9 $WEAVER_PID 2>/dev/null || true
          exit 1

      - name: Build Project
        timeout-minutes: 20
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:${{ env.OTLP_PORT }}
        run: |
          echo "🔨 Building project with OTEL features..."
          cargo build --release --features otel --quiet
          echo "✅ Build completed"

      - name: Run Tests with Telemetry
        timeout-minutes: 5
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:${{ env.OTLP_PORT }}
          RUST_BACKTRACE: 1
        run: |
          echo "🧪 Running tests with telemetry enabled..."
          timeout 120 cargo test --features otel --all -- --nocapture --test-threads=4 2>&1 | tail -50
          TEST_STATUS=${PIPESTATUS[0]}
          if [ $TEST_STATUS -ne 0 ] && [ $TEST_STATUS -ne 124 ]; then
            echo "❌ Tests failed with status $TEST_STATUS"
            exit 1
          fi
          echo "✅ Tests completed"

      - name: Wait for Telemetry Processing
        run: |
          echo "⏳ Waiting for telemetry processing (10s)..."
          sleep 10
          echo "✅ Wait completed"

      - name: Stop Weaver Live-Check
        if: always()
        run: |
          if [ ! -f weaver.pid ]; then
            echo "⚠️  Weaver PID file not found, skipping cleanup"
            exit 0
          fi

          WEAVER_PID=$(cat weaver.pid)
          echo "🛑 Stopping Weaver (PID: $WEAVER_PID)..."

          if ! kill -0 $WEAVER_PID 2>/dev/null; then
            echo "ℹ️  Weaver already stopped"
            exit 0
          fi

          # Graceful shutdown
          kill -TERM $WEAVER_PID 2>/dev/null || true
          for i in {1..30}; do
            if ! kill -0 $WEAVER_PID 2>/dev/null; then
              echo "✅ Weaver stopped gracefully"
              exit 0
            fi
            sleep 1
          done

          # Force kill
          echo "⚠️  Force killing Weaver"
          kill -9 $WEAVER_PID 2>/dev/null || true
          rm -f weaver.pid

      - name: Verify Validation Output
        if: steps.weaver.outcome == 'success'
        run: |
          if [ ! -f validation_output/live_check.json ]; then
            echo "❌ Validation output not found"
            echo "Checking directory contents:"
            ls -la validation_output/ || true
            if [ -f validation_output/weaver.log ]; then
              echo ""
              echo "Weaver log:"
              cat validation_output/weaver.log
            fi
            exit 1
          fi
          echo "✅ Validation output found"
          echo "File size: $(wc -c < validation_output/live_check.json) bytes"

      - name: Parse Validation Results
        if: steps.weaver.outcome == 'success'
        id: results
        run: |
          OUTPUT_FILE="validation_output/live_check.json"

          if [ ! -f "$OUTPUT_FILE" ]; then
            echo "❌ Output file missing: $OUTPUT_FILE"
            exit 1
          fi

          echo "📊 Parsing validation results..."

          # Extract statistics using jq with safe defaults
          VIOLATIONS=$(jq -r '.statistics.advice_level_counts.violation // 0' "$OUTPUT_FILE")
          WARNINGS=$(jq -r '.statistics.advice_level_counts.warning // 0' "$OUTPUT_FILE")
          COVERAGE=$(jq -r '.statistics.registry_coverage // 0' "$OUTPUT_FILE")

          # Use integer arithmetic instead of bc
          COVERAGE_PCT=$((COVERAGE * 100 / 100))

          echo "violations=$VIOLATIONS" >> $GITHUB_OUTPUT
          echo "warnings=$WARNINGS" >> $GITHUB_OUTPUT
          echo "coverage=$COVERAGE_PCT" >> $GITHUB_OUTPUT

          echo ""
          echo "📊 Validation Summary:"
          echo "   Violations: $VIOLATIONS"
          echo "   Warnings: $WARNINGS"
          echo "   Coverage: $COVERAGE_PCT%"
          echo ""

          # Generate GitHub Summary
          {
            echo "## 📊 Telemetry Validation Summary"
            echo ""
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| ❌ Violations | $VIOLATIONS |"
            echo "| ⚠️ Warnings | $WARNINGS |"
            echo "| 📈 Coverage | $COVERAGE_PCT% |"
            echo ""

            if [ "$VIOLATIONS" -gt 0 ]; then
              echo "### ❌ Violations Found"
              echo ""
              echo "\`\`\`"
              jq -r '.violations[]? | "[\(.level)] \(.message)"' "$OUTPUT_FILE" | head -20
              echo "\`\`\`"
              echo ""
            fi

            if [ "$WARNINGS" -gt 0 ]; then
              echo "### ⚠️ Warnings"
              echo ""
              echo "\`\`\`"
              jq -r '.warnings[]? | "[\(.level)] \(.message)"' "$OUTPUT_FILE" | head -20
              echo "\`\`\`"
              echo ""
            fi

            echo "### 📈 Coverage Analysis"
            echo ""
            if [ "$COVERAGE_PCT" -ge 80 ]; then
              echo "✅ Coverage meets target (80%): **$COVERAGE_PCT%**"
            elif [ "$COVERAGE_PCT" -ge 50 ]; then
              echo "⚠️ Coverage below target (80%): **$COVERAGE_PCT%**"
            else
              echo "❌ Coverage critically low: **$COVERAGE_PCT%**"
            fi
          } >> $GITHUB_STEP_SUMMARY

          # Fail if violations detected
          if [ "$VIOLATIONS" -gt 0 ]; then
            echo "❌ Validation found violations"
            exit 1
          fi

      - name: Upload Validation Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telemetry-validation-${{ github.sha }}
          path: validation_output/
          retention-days: 30
