name: Telemetry Validation

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

env:
  WEAVER_VERSION: "v0.10.0"
  OTLP_PORT: 4317
  VALIDATION_TIMEOUT: 300
  RUST_VERSION: "1.70"

jobs:
  validate-telemetry:
    name: Validate OpenTelemetry Schemas
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq bc lsof

      - name: Install Weaver CLI
        run: |
          wget -q https://github.com/open-telemetry/weaver/releases/download/${{ env.WEAVER_VERSION }}/weaver-linux-x86_64 -O weaver
          chmod +x weaver
          sudo mv weaver /usr/local/bin/
          weaver --version

      - name: Create Output Directory
        run: mkdir -p validation_output

      - name: Start Weaver Live-Check
        run: |
          echo "🔍 Starting Weaver live-check on port ${{ env.OTLP_PORT }}"

          weaver registry live-check \
            --registry registry/ \
            --otlp-grpc-port ${{ env.OTLP_PORT }} \
            --format json \
            --output validation_output/ \
            --inactivity-timeout ${{ env.VALIDATION_TIMEOUT }} \
            2>&1 | tee validation_output/weaver.log &

          echo $! > weaver.pid

          # Wait for server to start
          for i in {1..10}; do
            if lsof -i :${{ env.OTLP_PORT }} >/dev/null 2>&1; then
              echo "✅ Weaver live-check started on port ${{ env.OTLP_PORT }}"
              exit 0
            fi
            echo "⏳ Waiting for Weaver to start (attempt $i/10)..."
            sleep 2
          done

          echo "❌ Failed to start Weaver live-check"
          cat validation_output/weaver.log
          exit 1

      - name: Build Project
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:${{ env.OTLP_PORT }}
        run: |
          echo "🔨 Building project with OTEL features..."
          cargo build --release --features otel

      - name: Run Tests with Telemetry
        env:
          OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:${{ env.OTLP_PORT }}
          RUST_LOG: info
          RUST_BACKTRACE: 1
        run: |
          echo "🧪 Running tests with telemetry enabled..."
          cargo test --features otel --all -- --nocapture --test-threads=4

      - name: Wait for Telemetry Processing
        run: |
          echo "⏳ Waiting for telemetry to be processed..."
          sleep 5

      - name: Stop Weaver Live-Check
        if: always()
        run: |
          if [ ! -f weaver.pid ]; then
            echo "⚠️  Weaver PID file not found"
            exit 0
          fi

          PID=$(cat weaver.pid)
          echo "🛑 Stopping Weaver (PID: $PID)"

          if ! kill -0 $PID 2>/dev/null; then
            echo "⚠️  Weaver already stopped"
            exit 0
          fi

          # Send SIGHUP to trigger report generation
          echo "Sending SIGHUP signal..."
          kill -HUP $PID

          # Wait for graceful shutdown (up to 30 seconds)
          for i in {1..30}; do
            if ! kill -0 $PID 2>/dev/null; then
              echo "✅ Weaver stopped gracefully"
              exit 0
            fi
            sleep 1
          done

          # Force kill if still running
          echo "⚠️  Force killing Weaver"
          kill -9 $PID 2>/dev/null || true

      - name: Parse Validation Results
        if: always()
        id: results
        run: |
          if [ ! -f validation_output/live_check.json ]; then
            echo "❌ No validation output found"
            echo "Weaver log:"
            cat validation_output/weaver.log
            exit 1
          fi

          echo "📊 Parsing validation results..."

          # Extract statistics
          VIOLATIONS=$(jq -r '.statistics.advice_level_counts.violation // 0' validation_output/live_check.json)
          WARNINGS=$(jq -r '.statistics.advice_level_counts.warning // 0' validation_output/live_check.json)
          COVERAGE=$(jq -r '.statistics.registry_coverage // 0' validation_output/live_check.json)
          COVERAGE_PCT=$(echo "$COVERAGE * 100" | bc -l | cut -d. -f1)

          echo "violations=$VIOLATIONS" >> $GITHUB_OUTPUT
          echo "warnings=$WARNINGS" >> $GITHUB_OUTPUT
          echo "coverage=$COVERAGE_PCT" >> $GITHUB_OUTPUT

          # Display summary
          echo ""
          echo "📊 Validation Summary:"
          echo "   Violations: $VIOLATIONS"
          echo "   Warnings: $WARNINGS"
          echo "   Coverage: $COVERAGE_PCT%"
          echo ""

          # Generate GitHub Summary
          echo "## 📊 Telemetry Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| ❌ Violations | $VIOLATIONS |" >> $GITHUB_STEP_SUMMARY
          echo "| ⚠️ Warnings | $WARNINGS |" >> $GITHUB_STEP_SUMMARY
          echo "| 📈 Coverage | $COVERAGE_PCT% |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Show violations if any
          if [ "$VIOLATIONS" -gt 0 ]; then
            echo "### ❌ Violations Found" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            jq -r '.violations[]? | "[\(.level)] \(.message)"' validation_output/live_check.json >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          # Show warnings if any
          if [ "$WARNINGS" -gt 0 ]; then
            echo "### ⚠️ Warnings" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            jq -r '.warnings[]? | "[\(.level)] \(.message)"' validation_output/live_check.json >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          # Coverage analysis
          echo "### 📈 Coverage Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$COVERAGE_PCT" -ge 80 ]; then
            echo "✅ Coverage meets target (80%): **$COVERAGE_PCT%**" >> $GITHUB_STEP_SUMMARY
          elif [ "$COVERAGE_PCT" -ge 50 ]; then
            echo "⚠️ Coverage below target (80%): **$COVERAGE_PCT%**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Coverage critically low: **$COVERAGE_PCT%**" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Upload Validation Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telemetry-validation-${{ github.sha }}
          path: |
            validation_output/
          retention-days: 30

      - name: Check Quality Gate
        if: always()
        run: |
          VIOLATIONS=${{ steps.results.outputs.violations }}
          COVERAGE=${{ steps.results.outputs.coverage }}

          echo "🚦 Quality Gate Check"
          echo "   Violations: $VIOLATIONS (must be 0)"
          echo "   Coverage: $COVERAGE% (target: 80%)"
          echo ""

          EXIT_CODE=0

          # Check violations (blocking)
          if [ "$VIOLATIONS" -gt 0 ]; then
            echo "❌ Quality gate FAILED: $VIOLATIONS violations found"
            echo "   Telemetry MUST conform to registry schemas"
            EXIT_CODE=1
          else
            echo "✅ No violations found"
          fi

          # Check coverage (warning only)
          if [ "$COVERAGE" -lt 80 ]; then
            echo "⚠️  Warning: Registry coverage is ${COVERAGE}% (target: 80%)"
            echo "   Consider adding more schema coverage"
            # Warning only, don't fail
          else
            echo "✅ Coverage target met: ${COVERAGE}%"
          fi

          echo ""

          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "✅ Quality gate PASSED"
          else
            echo "❌ Quality gate FAILED"
          fi

          exit $EXIT_CODE

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const violations = parseInt('${{ steps.results.outputs.violations }}');
            const warnings = parseInt('${{ steps.results.outputs.warnings }}');
            const coverage = parseInt('${{ steps.results.outputs.coverage }}');

            const status = violations === 0 ? '✅ PASSED' : '❌ FAILED';
            const emoji = violations === 0 ? '🎉' : '🚨';

            let coverageStatus = '✅';
            if (coverage < 50) coverageStatus = '❌';
            else if (coverage < 80) coverageStatus = '⚠️';

            const comment = `
            ## ${emoji} Telemetry Validation ${status}

            | Metric | Value | Status |
            |--------|-------|--------|
            | Violations | ${violations} | ${violations === 0 ? '✅' : '❌'} |
            | Warnings | ${warnings} | ${warnings === 0 ? '✅' : '⚠️'} |
            | Coverage | ${coverage}% | ${coverageStatus} |

            ${violations === 0
              ? '**All telemetry conforms to registry schemas!** 🎉'
              : `**Violations detected!** Please fix telemetry to conform to schemas.

            See [workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.`}

            ${coverage < 80
              ? `\n⚠️ **Coverage below target (80%)**: Consider expanding schema coverage.`
              : ''}

            ---
            <sub>Generated by Weaver live-check v${{ env.WEAVER_VERSION }} | [Download artifacts](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})</sub>
            `;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const existingComment = comments.find(c =>
              c.body.includes('Telemetry Validation')
            );

            if (existingComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                comment_id: existingComment.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }
