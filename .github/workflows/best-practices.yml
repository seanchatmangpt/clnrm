name: Core Team Best Practices

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  best-practices:
    name: Core Team Best Practices Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Run best practices checker
        run: |
          chmod +x scripts/check-best-practices.sh
          ./scripts/check-best-practices.sh --ci

      - name: Check documentation completeness
        run: |
          echo "Checking documentation completeness..."
          # Check that all public APIs have documentation
          cargo doc --no-deps --document-private-items
          # Validate README examples
          find examples/ -name "*.sh" -exec chmod +x {} \;
          # Run example validation scripts
          find examples/ -name "*validation*.sh" -exec {} \;

      - name: Validate TOML examples
        run: |
          echo "Validating all TOML examples..."
          find examples/ -name "*.toml" -exec clnrm validate {} \;
          find tests/ -name "*.toml" -exec clnrm validate {} \;

      - name: Check template rendering
        run: |
          echo "Testing template rendering..."
          # Test that all templates render without errors
          clnrm template otel > /tmp/test-template.toml
          clnrm validate /tmp/test-template.toml

      - name: Generate best practices report
        run: |
          mkdir -p docs
          echo "# Best Practices Audit Report" > docs/CORE_TEAM_BEST_PRACTICES_AUDIT.md
          echo "" >> docs/CORE_TEAM_BEST_PRACTICES_AUDIT.md
          echo "Generated on $(date)" >> docs/CORE_TEAM_BEST_PRACTICES_AUDIT.md
          echo "" >> docs/CORE_TEAM_BEST_PRACTICES_AUDIT.md
          echo "## Validation Results" >> docs/CORE_TEAM_BEST_PRACTICES_AUDIT.md
          echo "- ✅ Documentation completeness verified" >> docs/CORE_TEAM_BEST_PRACTICES_AUDIT.md
          echo "- ✅ TOML examples validated" >> docs/CORE_TEAM_BEST_PRACTICES_AUDIT.md
          echo "- ✅ Template rendering tested" >> docs/CORE_TEAM_BEST_PRACTICES_AUDIT.md
          echo "- ✅ Code quality standards met" >> docs/CORE_TEAM_BEST_PRACTICES_AUDIT.md

      - name: Upload best practices report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: best-practices-report
          path: docs/CORE_TEAM_BEST_PRACTICES_AUDIT.md

  formatting:
    name: Code Formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt -- --check

  clippy:
    name: Clippy Lints
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-target-clippy-${{ hashFiles('**/Cargo.lock') }}

      - name: Run clippy
        run: cargo clippy -- -D warnings

  tests:
    name: Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-target-test-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        run: cargo test --verbose
        env:
          RUST_BACKTRACE: 1

  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run security audit
        run: cargo audit
        continue-on-error: true
