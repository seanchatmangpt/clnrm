name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ matrix.rust }}
        components: rustfmt, clippy

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v4
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache target directory
      uses: actions/cache@v4
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

    - name: Install Weaver
      run: |
        cargo install --locked weaver-cli || echo "Weaver already installed"
        weaver --version

    - name: Run cargo check
      run: cargo check --all-features

    - name: Run cargo fmt check
      run: cargo fmt --all -- --check

    - name: Run cargo clippy
      run: cargo clippy --all-features -- -D warnings -A clippy::unnecessary_unwrap

    - name: Run unit tests
      run: cargo test --lib --all-features

    - name: Run integration tests
      run: cargo test --test '*' --all-features

    - name: Build release binary
      run: cargo build --release --features otel

    - name: Validate Weaver registry
      run: weaver registry check -r registry/

    - name: Run E2E validation
      if: matrix.os == 'ubuntu-latest'
      run: |
        # Set registry path for CI environment
        export CLNRM_REGISTRY_PATH="${PWD}/registry"
        ./tests/e2e/v1_2_1_validation.sh

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable

    - name: Run cargo audit
      run: |
        cargo install cargo-audit || echo "cargo-audit already installed"
        cargo audit --deny warnings || echo "Audit warnings found"

    - name: Check for secrets
      run: |
        ! git grep -i "api.key\|password\|secret\|token" -- '*.rs' '*.toml' || echo "Potential secrets found"

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable

    - name: Install tarpaulin
      run: cargo install cargo-tarpaulin || echo "tarpaulin already installed"

    - name: Generate coverage
      run: cargo tarpaulin --out Xml --all-features

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./cobertura.xml
        fail_ci_if_error: false
