name: Weaver Validation

on:
  push:
    branches: [ main, master ]
    paths:
      - 'registry/**'
      - 'crates/*/src/**'
      - '.github/workflows/weaver-validation.yml'
  pull_request:
    paths:
      - 'registry/**'
      - 'crates/*/src/**'

jobs:
  schema-validation:
    name: Validate Weaver Registry
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Weaver
      id: install-weaver
      continue-on-error: true
      run: |
        cargo install weaver-cli --locked 2>/dev/null || cargo install weaver-forge --locked 2>/dev/null
        command -v weaver && weaver --version

    - name: Validate registry schemas
      if: steps.install-weaver.outcome == 'success'
      run: |
        # FMEA fix: Capture output and validate explicitly
        echo "🔍 Validating Weaver registry..."
        weaver registry check -r registry/ 2>&1 | tee weaver-check.log
        VALIDATION_RESULT=${PIPESTATUS[0]}

        # FMEA fix: More robust error detection using explicit patterns
        if [ ! -f weaver-check.log ]; then
          echo "❌ Validation log not created"
          exit 1
        fi

        # Check command exit code first
        if [ $VALIDATION_RESULT -ne 0 ]; then
          echo "❌ Schema validation failed (exit code: $VALIDATION_RESULT)"
          cat weaver-check.log
          exit 1
        fi

        # FMEA fix: Use grep -E with anchored patterns to avoid false positives
        if grep -q "policy violation" weaver-check.log; then
          echo "❌ Schema validation failed - policy violations detected"
          grep "policy violation" weaver-check.log
          exit 1
        fi

        # FMEA fix: Look for explicit error patterns, not just "Error"
        if grep -E "^Error:|^FATAL:|validation.*failed" weaver-check.log; then
          echo "❌ Schema validation failed - errors detected"
          exit 1
        fi

        echo "✅ Schema validation passed"

    - name: Generate schema documentation
      continue-on-error: true
      run: |
        # FMEA fix: Explicit error handling instead of error suppression
        echo "📚 Generating schema documentation..."
        mkdir -p docs

        if weaver registry generate -r registry/ --format markdown > docs/SCHEMA_REFERENCE.md; then
          echo "✅ Schema documentation generated"
        else
          echo "⚠️  Schema documentation generation failed (optional step)"
        fi

    - name: Upload schema validation results
      uses: actions/upload-artifact@v4
      with:
        name: weaver-validation
        path: |
          weaver-check.log
          docs/SCHEMA_REFERENCE.md
        retention-days: 30

  live-check:
    name: Weaver Live-Check Integration
    runs-on: ubuntu-latest
    services:
      jaeger:
        image: jaegertracing/all-in-one:latest
        ports:
          - 16686:16686
          - 14268:14268
          - 4317:4317

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Install Weaver
      id: install-weaver
      continue-on-error: true
      run: |
        cargo install weaver-cli --locked 2>/dev/null || cargo install weaver-forge --locked 2>/dev/null
        command -v weaver && weaver --version

    - name: Wait for Jaeger to be ready
      run: |
        # FMEA fix: Polling-based health check instead of fixed sleep
        echo "⏳ Waiting for Jaeger to be ready (timeout: 60s)..."
        ELAPSED=0
        MAX_WAIT=60

        while [ $ELAPSED -lt $MAX_WAIT ]; do
          if curl -sf http://localhost:16686/ > /dev/null 2>&1; then
            echo "✅ Jaeger is ready"
            break
          fi

          echo "⏳ Waiting... (${ELAPSED}s elapsed)"
          sleep 2
          ELAPSED=$((ELAPSED + 2))
        done

        if [ $ELAPSED -ge $MAX_WAIT ]; then
          echo "⚠️  Jaeger may not be fully ready, proceeding anyway"
        fi

    - name: Build clnrm with OTEL
      run: cargo build --release --features otel

    - name: Run clnrm with Weaver validation
      env:
        CLNRM_REGISTRY_PATH: ${{ github.workspace }}/registry
      run: |
        # FMEA fix: Use polling instead of platform-specific timeout command
        echo "🧪 Running clnrm with Weaver validation..."
        ELAPSED=0
        MAX_TIMEOUT=120

        # Run clnrm in background
        ./target/release/clnrm run tests/ --validate &
        PID=$!

        # Wait for completion with timeout
        while [ $ELAPSED -lt $MAX_TIMEOUT ]; do
          if ! kill -0 $PID 2>/dev/null; then
            wait $PID
            exit $?
          fi

          sleep 2
          ELAPSED=$((ELAPSED + 2))
        done

        # If still running, kill it
        echo "❌ Test execution timeout after ${MAX_TIMEOUT}s"
        kill -9 $PID 2>/dev/null || true
        exit 1

    - name: Check Weaver validation report
      run: |
        # FMEA fix: Explicit error handling for JSON parsing
        if [ ! -f validation_output/report.json ]; then
          echo "⚠️  No Weaver validation report found"
          ls -la validation_output/ 2>/dev/null || echo "validation_output directory not found"
          exit 0
        fi

        echo "✅ Weaver validation report generated"

        # FMEA fix: Use jq with safe defaults for missing fields
        if ! jq . validation_output/report.json > /dev/null 2>&1; then
          echo "❌ Invalid JSON in validation report"
          cat validation_output/report.json
          exit 1
        fi

        cat validation_output/report.json

        # FMEA fix: Use jq safe defaults (.sample_count // 0) to handle missing fields
        SAMPLES=$(jq '.sample_count // 0' validation_output/report.json)

        if [ -z "$SAMPLES" ] || [ ! "$SAMPLES" -ge 0 ] 2>/dev/null; then
          echo "❌ Could not parse sample count from report"
          exit 1
        fi

        if [ "$SAMPLES" -eq 0 ]; then
          echo "❌ Zero telemetry samples received"
          exit 1
        fi

        echo "✅ Received $SAMPLES telemetry samples"

    - name: Upload validation artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: weaver-live-check
        path: |
          validation_output/**
        retention-days: 30
