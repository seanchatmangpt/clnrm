name: Unit Tests (Docker-Independent)

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

# Explicit permissions (read-only for tests)
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  unit-tests:
    name: Unit Tests (Core Framework)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Rust with cache
      uses: ./.github/actions/setup-rust-cache
      with:
        components: 'rustfmt, clippy'
        cache-key-prefix: 'unit-${{ matrix.os }}'

    - name: Run cargo check (all features)
      run: cargo check --all-features

    - name: Run cargo fmt check
      run: cargo fmt --all -- --check

    - name: Run cargo clippy
      run: cargo clippy --all-features -- -D warnings -A clippy::unnecessary_unwrap

    - name: Run unit tests (no Docker integration)
      run: |
        # Core unit tests that don't require Docker
        # Tests with docker-integration feature are excluded at compile-time
        cargo test --lib --all-features

    - name: Build release binary
      run: cargo build --release --features otel

  integration-gvisor:
    name: Integration Tests (gVisor)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup gVisor runtime
      run: |
        echo "📦 Installing gVisor..."
        if ! command -v runsc &> /dev/null; then
          sudo apt-get update
          sudo apt-get install -y gvisor || echo "⚠️  gVisor not available in package manager"
        fi
        echo "✅ gVisor runtime configured"

    - name: Setup Rust with cache
      uses: ./.github/actions/setup-rust-cache
      with:
        components: 'rustfmt, clippy'
        cache-key-prefix: 'integration-gvisor'

    - name: Run integration tests (gVisor runtime)
      run: |
        # Full integration test suite using gVisor container runtime
        export DOCKER_RUNTIME="--runtime=runsc"
        cargo test --test '*' --all-features
