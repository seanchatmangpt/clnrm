# Composite Action: Port Health Check
# Robust port availability checking with retries and diagnostics
# Usage:
#   - uses: ./.github/actions/port-health-check
#     with:
#       port: '4317'
#       timeout: '30'

name: Port Health Check
description: 'Check port availability and kill zombie processes'

inputs:
  port:
    description: 'Port number to check'
    required: true
  timeout:
    description: 'Timeout in seconds'
    required: false
    default: '30'
  retry-count:
    description: 'Number of retry attempts'
    required: false
    default: '5'

outputs:
  port-available:
    description: 'Whether port is available'
    value: ${{ steps.check.outputs.available }}

runs:
  using: 'composite'
  steps:
    - name: Install port checking tools
      shell: bash
      run: |
        if ! command -v netstat &> /dev/null && ! command -v ss &> /dev/null; then
          echo "Installing net-tools..."
          sudo apt-get update -qq
          sudo apt-get install -y -qq net-tools > /dev/null 2>&1
        fi

    - name: Kill zombie processes on port
      shell: bash
      continue-on-error: true
      run: |
        PORT=${{ inputs.port }}
        echo "🔍 Checking for zombie processes on port $PORT..."

        if command -v fuser &> /dev/null; then
          PIDS=$(fuser -q $PORT/tcp 2>/dev/null || true)
          if [ -n "$PIDS" ]; then
            echo "⚠️  Found processes on port $PORT: $PIDS"
            echo "🔪 Killing zombie processes..."
            fuser -k -q $PORT/tcp 2>/dev/null || true
            sleep 2
          fi
        fi

    - name: Verify port availability
      id: check
      shell: bash
      run: |
        PORT=${{ inputs.port }}
        TIMEOUT=${{ inputs.timeout }}
        RETRIES=${{ inputs.retry-count }}
        ATTEMPT=1

        echo "Checking if port $PORT is available (timeout: ${TIMEOUT}s, retries: $RETRIES)..."

        while [ $ATTEMPT -le $RETRIES ]; do
          if netstat -ln 2>/dev/null | grep -q ":$PORT " || ss -ln 2>/dev/null | grep -q ":$PORT "; then
            echo "⚠️  Attempt $ATTEMPT: Port $PORT is IN USE"
            if [ $ATTEMPT -lt $RETRIES ]; then
              sleep 5
              ATTEMPT=$((ATTEMPT + 1))
            else
              echo "available=false" >> $GITHUB_OUTPUT
              exit 1
            fi
          else
            echo "✅ Port $PORT is AVAILABLE"
            echo "available=true" >> $GITHUB_OUTPUT
            exit 0
          fi
        done

        echo "available=false" >> $GITHUB_OUTPUT
        exit 1
